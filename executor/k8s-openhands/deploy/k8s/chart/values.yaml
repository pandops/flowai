image:
  repository: flowai/executor_k8s_openhands
  tag: v0005-e2e
  pullPolicy: IfNotPresent

stateRegistryURL: http://state-registry:18443

hostAliases: []

storageClass:
  create: false
  name: flowai-local-path
  provisioner: flowai.io/local-path
  image: rancher/local-path-provisioner:v0.0.32
  helperImage: busybox:1.36.1

persistence:
  enabled: true
  size: 1Gi

executor:
  enabled: true
  scope: team
  teamID: team-a
  authorizedTag: k8s-cluster-a
  maxPods: 2
  cacheDir: /var/lib/flowai/executor-k8s/cache
  finishedCleanupDelay: 0s
  failedCleanupDelay: 0s

openhands:
  llmModel: openai/gpt-4o-mini
  llmAPIKey: ""
  llmUsageID: flowai-executor

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 500m
    memory: 256Mi
