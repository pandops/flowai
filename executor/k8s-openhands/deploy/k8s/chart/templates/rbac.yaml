{{- if .Values.executor.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: executor-k8s-openhands
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: executor-k8s-openhands
subjects:
  - kind: ServiceAccount
    name: executor-k8s-openhands
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: executor-k8s-openhands
{{- end }}
