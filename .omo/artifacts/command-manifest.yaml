# FlowAI v2 - Local Command Manifest
# Source of truth for every quality gate. Each command below is the exact
# shell invocation a developer runs locally; the GitLab CI pipeline
# (.gitlab-ci.yml) calls the same commands. Do NOT duplicate these commands
# as prose anywhere else.
#
# Conventions:
#   - cwd: repository root
#   - shell: sh-compatible (bash on Linux runners)
#   - exit code: 0 == pass; non-zero == fail
#   - declared skip code: 78 (used for runner-tooling checks such as k3d)
#
# Required keys (per plan Task 6): format_check, lint, typecheck, unit_test,
# integration_test, contract_test, e2e_test, helm_lint, k3d_smoke, ci_check.
# Additional Go-specific commands (go_vet, go_test) are included so the
# pipeline can run the full set from ADR 0009.
schema_version: 1

project:
  name: flowai-v2
  repository: flowai_v2
  stack_ref: docs/adr/0002-stack.md
  layout_ref: docs/adr/0003-repo-layout.md
  ci_strategy_ref: docs/adr/0009-ci-test-strategy.md

# Skip code convention used by runner-environment-dependent checks.
# Returning this code (78) is documented as a non-blocking skip, per
# scripts/k3d-smoke.sh and scripts/helm-lint.sh.
skip_code: 78

commands:
  format_check:
    description: Verify Prettier formatting across the monorepo.
    run: pnpm run format:check
    shell: bash
    cwd: .
    exit_code_expected: 0
    maps_to_gitlab_ci_job: format_check
    maps_to_stage: lint

  lint:
    description: ESLint static analysis over TS/TSX sources.
    run: pnpm run lint
    shell: bash
    cwd: .
    exit_code_expected: 0
    maps_to_gitlab_ci_job: lint
    maps_to_stage: lint

  typecheck:
    description: TypeScript project-references typecheck.
    run: pnpm run typecheck
    shell: bash
    cwd: .
    exit_code_expected: 0
    maps_to_gitlab_ci_job: typecheck
    maps_to_stage: lint

  go_vet:
    description: Run `go vet ./...` for every Go service in apps/.
    run: bash ./scripts/go-vet.sh
    shell: bash
    cwd: .
    exit_code_expected: 0
    maps_to_gitlab_ci_job: go-vet
    maps_to_stage: lint

  unit_test:
    description: Vitest unit tests for apps/* and packages/*.
    run: pnpm run test
    shell: bash
    cwd: .
    exit_code_expected: 0
    maps_to_gitlab_ci_job: unit_test
    maps_to_stage: test

  go_test:
    description: Run `go test ./...` for every Go service in apps/.
    run: bash ./scripts/go-test.sh
    shell: bash
    cwd: .
    exit_code_expected: 0
    maps_to_gitlab_ci_job: go_test
    maps_to_stage: test

  contract_test:
    description: Vitest contract test suite (event/api schema conformance).
    run: pnpm exec vitest run --config vitest.contract.config.ts
    shell: bash
    cwd: .
    exit_code_expected: 0
    maps_to_gitlab_ci_job: contract_test
    maps_to_stage: test

  integration_test:
    description: Vitest integration tests; uses testcontainers for NATS/Postgres (per ADR 0009).
    run: pnpm exec vitest run --config vitest.integration.config.ts
    shell: bash
    cwd: .
    exit_code_expected: 0
    allow_skip_on_runner_without_docker: false
    maps_to_gitlab_ci_job: integration_test
    maps_to_stage: test

  helm_lint:
    description: Run `helm lint` over every chart in infra/helm.
    run: bash ./scripts/helm-lint.sh
    shell: bash
    cwd: .
    exit_code_expected: 0
    allow_skip_code: 78
    allow_skip_reason: helm binary not present on runner
    maps_to_gitlab_ci_job: helm_lint
    maps_to_stage: test

  k3d_smoke:
    description: Bring up / smoke-test the k3d dev cluster (ADR 0004).
    run: bash ./scripts/k3d-smoke.sh
    shell: bash
    cwd: .
    exit_code_expected: 0
    allow_skip_code: 78
    allow_skip_reason: k3d or docker binary not present on runner
    skip_evidence: .omo/evidence/task-7-k3d-skip.txt
    maps_to_gitlab_ci_job: k3d_smoke
    maps_to_stage: deploy

  e2e_test:
    description: Vitest e2e tests against the deployed k3d cluster.
    run: pnpm exec vitest run --config vitest.e2e.config.ts
    shell: bash
    cwd: .
    exit_code_expected: 0
    allow_skip_code: 0
    allow_skip_reason: no e2e scenarios yet (scaffold phase); passWithNoTests lets it exit 0
    maps_to_gitlab_ci_job: e2e_test
    maps_to_stage: e2e

  build:
    description: TypeScript project-references build (no service Docker images yet).
    run: pnpm run build
    shell: bash
    cwd: .
    exit_code_expected: 0
    maps_to_gitlab_ci_job: build
    maps_to_stage: build

  ci_check:
    description: |
      Umbrella command wired to the GitLab CI `ci_check` job.
      Aggregates format_check + lint + typecheck + unit_test + go_vet + go_test
      + helm_lint + k3d_smoke into a single exit code. Exits 0 only when all
      individual commands either pass or return their declared skip_code.
    run: pnpm run ci:check
    shell: bash
    cwd: .
    exit_code_expected: 0
    maps_to_gitlab_ci_job: ci_check
    maps_to_stage: lint
    invocation_evidence: .omo/evidence/task-6-ci-check.txt

# GitLab CI topology note - mirrors the prose at the top of .gitlab-ci.yml.
gitlab_ci:
  source_of_truth: .gitlab-ci.yml
  stages: [lint, test, build, deploy, e2e]
  push_path: Gitea (developer push surface)
  runs_on: GitLab CI (auto-proxied/mirrored push from Gitea)
  no_gitea_actions: true
  notes: |
    The repository origin of record is Gitea. Every push is auto-proxied /
    mirrored to the GitLab project where CI runs. We deliberately do NOT
    maintain a `.gitea/workflows/` definition. If a developer needs CI
    feedback locally, they invoke `pnpm run ci:check` (the ci_check key)
    and get the same exit code as GitLab CI.

# Local-CI parity check - if this exits non-zero the manifest is out of sync.
local_parity_check:
  description: Run the same command any CI runner runs - confirms exits-0 contract.
  command: pnpm run ci:check
  evidence: .omo/evidence/task-6-ci-check.txt
