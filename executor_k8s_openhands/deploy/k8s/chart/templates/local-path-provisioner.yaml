{{- if .Values.storageClass.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flowai-local-path-provisioner
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowai-local-path-config
data:
  config.json: |-
    {"nodePathMap":[{"node":"DEFAULT_PATH_FOR_NON_LISTED_NODES","paths":["/var/lib/flowai-local-path"]}]}
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: helper-pod
          image: {{ .Values.storageClass.helperImage | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flowai-local-path-provisioner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flowai-local-path-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flowai-local-path-provisioner
subjects:
  - kind: ServiceAccount
    name: flowai-local-path-provisioner
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: flowai-local-path-provisioner
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: flowai-local-path-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: flowai-local-path-provisioner
subjects:
  - kind: ServiceAccount
    name: flowai-local-path-provisioner
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowai-local-path-provisioner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flowai-local-path-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowai-local-path-provisioner
    spec:
      serviceAccountName: flowai-local-path-provisioner
      containers:
        - name: provisioner
          image: {{ .Values.storageClass.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - {{ .Values.storageClass.provisioner | quote }}
            - --service-account-name
            - flowai-local-path-provisioner
            - --configmap-name
            - flowai-local-path-config
            - --helper-image
            - {{ .Values.storageClass.helperImage | quote }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
          volumeMounts:
            - name: config
              mountPath: /etc/config/
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: flowai-local-path-config
{{- end }}
