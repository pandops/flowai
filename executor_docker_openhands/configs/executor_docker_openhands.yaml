executor_api_bind: "127.0.0.1:8020"
executor_max_containers: 2
docker_socket_path: /var/run/docker.sock
openhands_image: ghcr.io/openhands/agent-server:latest-python
openhands_host_port_start: 18000
openhands_host_port_end: 18099
openhands_api_key: ""
openhands_startup_timeout: 60s
openhands_drain_timeout: 30s
# V1 conversation startup fields. The Executor must satisfy exactly one
# of: an AgentProfileID OR (LLMModel + LLMAPIKey + LLMUsageID). The
# harness sets these via OPENHANDS_LLM_* / OPENHANDS_AGENT_PROFILE_ID
# environment variables at runtime; defaults are placeholders so the
# load succeeds without a real backend.
openhands_workspace: "/workspace/project"
openhands_llm_model: "openai/gpt-4o-mini"
openhands_llm_api_key: "flowai-placeholder-key"
openhands_llm_usage_id: "flowai-executor"
openhands_initial_run: true
image_pull_policy: if-not-present
log_level: info
# State Registry is the Executor's mandatory control plane.
# After v0009 the backend transport is plain HTTP; external HTTPS
# terminates at the Ingress; the deployment network policy owns
# the caller boundary. The three legacy mTLS fields below remain
# accepted for staged configuration cleanup but the Executor
# never reads them; the values may be empty.
state_registry_url: "http://127.0.0.1:18443"
state_registry_tls_client_cert: ""
state_registry_tls_client_key: ""
state_registry_tls_server_ca: ""
poll_interval: 2s
# v0005 retention window after the State Registry accepts the
# terminal task event. Each default is 0s (immediate cleanup); a
# non-zero delay keeps the container counted against local capacity
# until the deadline expires. Shutdown, drain, and explicit
# cancellation may clean up sooner. A failed removal SHALL NOT
# append a second terminal task event.
finished_cleanup_delay: "0s"
failed_cleanup_delay: "0s"
