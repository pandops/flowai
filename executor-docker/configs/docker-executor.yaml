executor_api_bind: "127.0.0.1:8020"
routing_target: openhands
executor_max_containers: 2
docker_socket_path: /var/run/docker.sock
openhands_image: ghcr.io/openhands/agent-server:latest-python
openhands_host_port_start: 18000
openhands_host_port_end: 18099
openhands_api_key: ""
openhands_interrupt_endpoint: /api/conversations/{conversation_id}/pause
openhands_message_endpoint: /api/conversations/{conversation_id}/events
openhands_message_event_type: message
openhands_interrupt_timeout: 15s
openhands_startup_timeout: 60s
openhands_drain_timeout: 30s
image_pull_policy: if-not-present
log_level: info
mocked_server_url: http://127.0.0.1:8080/v1
env_scope_token: default-scope
poll_interval: 2s