openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: FlowAI State Registry API
  version: v0002-proposed
  summary: Normative tenant-aware contract for the v0002 State Registry.
  description: |
    The State Registry is the durable source of truth for team-owned tasks,
    Executors, assignments, immutable events, controls, environments, logical
    secrets, immutable encrypted secret versions, and audit entries.

    Every caller is authenticated with mutually authenticated TLS. Listener and
    Executor identities are each bound to exactly one immutable team. Operator
    operations are accepted only from the trusted API Gateway service identity
    together with the internal context headers defined by this contract.
    `X-FlowAI-Team-ID` is the sole tenant authority and is required on every
    Gateway-mediated request. `X-FlowAI-Team-Name` is optional display and
    audit context; when present it is never trusted to grant, select, or
    broaden access, and when absent the Registry still authorizes solely by
    `X-FlowAI-Team-ID`.

    All point lookups treat a resource owned by another team exactly like an
    unknown identifier and return the same closed `ErrorResponse` shape. All
    collection filters, pagination, totals, cursors, aggregations, WebSocket
    replay, and live fan-out are applied after the authenticated team predicate.
    A foreign-only collection is therefore empty (or `204` where explicitly
    defined), with no metadata that reveals foreign rows.

    OpenBao Transit is used only after State Registry has authorized the caller,
    tenant, parent relationships, assignment, and scope. Gateway responses never
    contain secret plaintext, decrypted environment values, Transit ciphertext,
    or decryption material. Plaintext is returned only by the assigned-Executor
    open-environment operation and exists only in memory for that response.
  license:
    name: Internal planning artifact
    identifier: LicenseRef-Internal-Planning

servers:
  - url: https://state-registry.internal
    description: Mutually authenticated internal service endpoint

security: []

tags:
  - name: Listener tasks
  - name: Executor identity
  - name: Executor discovery
  - name: Executor events
  - name: Gateway reads
  - name: Controls
  - name: Environments
  - name: Secrets
  - name: Audit
  - name: Subscriptions

paths:
  /v1/tasks:
    post:
      tags: [Listener tasks]
      summary: Persist or deduplicate a listener task
      operationId: ingestTask
      description: |
        The authenticated listener identity is bound to one team and source.
        The body `team_id` must equal that binding. A new task and its
        registry-owned `created` event are committed in one transaction before
        `201` is returned. A retry of `(team_id, source, source_task_id)` returns
        the existing canonical task with `200` and appends no event.
      security:
        - ListenerMTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskIngestionRequest'
      responses:
        '201':
          description: New canonical task and `created` event committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '200':
          description: Existing canonical task returned for an idempotent team-scoped retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
    get:
      tags: [Gateway reads]
      summary: List tasks in the operator team
      operationId: listTasks
      description: |
        Team filtering occurs before every filter, total, cursor, and page is
        computed. Foreign rows cannot affect an empty result, count, or cursor.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
        - $ref: '#/components/parameters/TaskStateFilter'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/SourceFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Team-filtered task page, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'

  /v1/tasks/{task_id}:
    get:
      tags: [Gateway reads]
      summary: Read a canonical task
      operationId: getTask
      description: A foreign-team task identifier returns the same `404 task_unknown` response as an unknown identifier.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      responses:
        '200':
          description: Team-owned canonical task without plaintext secret values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /v1/tasks/{task_id}/events:
    post:
      tags: [Executor events]
      summary: Append an assigned-Executor lifecycle event
      operationId: appendTaskEvent
      description: |
        Accepts only `running`, `finished`, or `failed` from the authenticated
        Executor currently assigned to the same-team task. The complete envelope
        includes `team_id`. An identical `(task_id, event_id)` retry returns the
        original `202` result. New events must follow the lifecycle and have an
        `(occurred_at, event_id)` tuple strictly greater than the latest accepted
        tuple. `accepted_sequence` and other recovery overrides are not accepted.
      security:
        - ExecutorMTLS: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskEventAppendRequest'
      responses:
        '202':
          description: Event accepted, or original acceptance returned for an identical retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAcceptance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The authenticated Executor is on the same team but is not the
            assigned Executor (`not_assigned`) or its envelope `team_id`
            does not match its immutable service binding (`team_mismatch`).
            No event is appended and no projection changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_assigned:
                  summary: Same-team Executor is not the assigned writer.
                  value:
                    code: not_assigned
                    message: Authenticated Executor is not the assigned writer for this task.
                    request_id: req-redacted
                team_mismatch:
                  summary: Envelope team identity does not match this Executor.
                  value:
                    code: team_mismatch
                    message: Authenticated envelope team identity does not match this Executor.
                    request_id: req-redacted
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/InvalidTaskTransition'
    get:
      tags: [Gateway reads]
      summary: Read ordered task event history
      operationId: listTaskEvents
      description: |
        Returns only events inherited from the trusted Gateway team, ordered by
        `(occurred_at ASC, event_id ASC)`. Team filtering is applied before the
        cursor and page are computed. Registry-emitted `created` and `dispatched`
        events have `executor_id: null`; Executor-emitted events have non-null
        `executor_id` and required `team_id`.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Deterministically ordered, team-filtered event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEventPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /v1/executors:
    get:
      tags: [Gateway reads]
      summary: List Executors in the operator team
      operationId: listExecutors
      description: Team filtering precedes tag, type, cursor, total, and page shaping.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
        - $ref: '#/components/parameters/TagFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Team-filtered Executor page, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutorPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'

  /v1/executors/{executor_id}:
    put:
      tags: [Executor identity]
      summary: Register or refresh one team-bound Executor
      operationId: registerExecutor
      description: |
        The body `team_id` must equal the immutable team bound to the authenticated
        Executor identity. `authorized_tag` is one required scalar tag; zero-tag
        and multi-tag representations are rejected with `400 invalid_tag_count`.
        `max_capacity` and `running_count` are observations only and never gate
        discovery, approval, or lifecycle-event acceptance.
      security:
        - ExecutorMTLS: []
      parameters:
        - $ref: '#/components/parameters/ExecutorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutorRegistrationRequest'
      responses:
        '200':
          description: Canonical Executor record registered or refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Executor'
        '400':
          description: Invalid registration, including `invalid_tag_count`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
    get:
      tags: [Gateway reads]
      summary: Read a canonical Executor
      operationId: getExecutor
      description: A foreign-team Executor identifier returns the same `404 executor_unknown` response as an unknown identifier.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/ExecutorId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      responses:
        '200':
          description: Team-owned Executor record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Executor'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ExecutorNotFound'

  /v1/executors/{executor_id}/tasks:
    get:
      tags: [Executor discovery]
      summary: Discover created tasks by the exact registered tag
      operationId: discoverExecutorTasks
      description: |
        The authenticated Executor may request only its one registered tag.
        Selection first matches the Executor's immutable team, then exact tag,
        and is read-only. It never reserves or assigns a task and never reads or
        enforces capacity. If only foreign-team tasks match, the result is `204`
        (or an empty `200` page) without count, cursor, or timing disclosure.
      security:
        - ExecutorMTLS: []
      parameters:
        - $ref: '#/components/parameters/ExecutorId'
        - name: tag
          in: query
          required: true
          description: Must exactly equal the authenticated Executor's single registered tag.
          schema:
            $ref: '#/components/schemas/Tag'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One or more same-team, same-tag `created` task summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDiscoveryPage'
        '204':
          description: No same-team, same-tag `created` task is visible; no pagination metadata is returned.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ExecutorNotFound'

  /v1/executors/{executor_id}/approvals:
    post:
      tags: [Executor discovery]
      summary: Atomically approve one task start
      operationId: approveTaskStart
      description: |
        Approves only a `created` same-team task whose required tag exactly equals
        the authenticated Executor's registered tag. Success atomically assigns
        the Executor, appends registry-owned `dispatched`, and returns `200`.
        Capacity observations are not read or evaluated and this operation never
        returns a capacity-related error or `422`. A stale same-team request
        returns `409 task_already_dispatched`; a foreign task returns the same
        `404 task_unknown` response as an unknown task.
      security:
        - ExecutorMTLS: []
      parameters:
        - $ref: '#/components/parameters/ExecutorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Task start approved and assignment committed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
        '409':
          $ref: '#/components/responses/TaskAlreadyDispatched'

  /v1/executors/{executor_id}/events:
    post:
      tags: [Executor events]
      summary: Append an Executor self event
      operationId: appendExecutorEvent
      description: |
        The complete self-event envelope includes the authenticated Executor's
        immutable `team_id`, non-null `executor_id`, nullable `task_id`, stable
        `event_id`, `event_type`, `occurred_at`, and `payload`. Capacity values in
        a `capacity_observed` payload are mirrored to the Executor row in the same
        transaction but never gate work. An identical retry returns the original
        `202` result without duplication.
      security:
        - ExecutorMTLS: []
      parameters:
        - $ref: '#/components/parameters/ExecutorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutorEventAppendRequest'
      responses:
        '202':
          description: Event accepted, or original acceptance returned for an identical retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAcceptance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: |
            The authenticated Executor's envelope `team_id` does not match
            its immutable service binding (`team_mismatch`). Same-team
            executors are the only writers and no event is appended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                team_mismatch:
                  value:
                    code: team_mismatch
                    message: Authenticated envelope team identity does not match this Executor.
                    request_id: req-redacted
        '404':
          $ref: '#/components/responses/ExecutorNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Gateway reads]
      summary: Read ordered Executor self-event history
      operationId: listExecutorEvents
      description: Team filtering is applied before event pagination and serialization.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/ExecutorId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Team-filtered Executor event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutorEventPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ExecutorNotFound'

  /v1/tasks/{task_id}/controls:
    post:
      tags: [Controls]
      summary: Create an audit-backed operator control
      operationId: createTaskControl
      description: |
        Accepted only from trusted Gateway context for a task in the same team.
        The idempotency key is scoped to `(team_id, task_id, operator_id, action)`.
        A foreign task returns the same `404 task_unknown` response as unknown and
        creates neither a control nor a domain event.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlCreateRequest'
      responses:
        '202':
          description: Control and plaintext-free audit entry accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Control'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/TaskNotFound'
    get:
      tags: [Controls]
      summary: Read pending controls for an assigned task
      operationId: listAssignedTaskControls
      description: |
        Executor-only read. The authenticated Executor must be the immutable
        assignee of the same-team task. A foreign task is indistinguishable from
        unknown. An unassigned same-team Executor receives `403 not_assigned`.
      security:
        - ExecutorMTLS: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Pending team-owned controls for the assigned task, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAssigned'
        '404':
          $ref: '#/components/responses/TaskNotFound'

  /v1/tasks/{task_id}/controls/{control_id}:
    get:
      tags: [Controls]
      summary: Read one control through API Gateway
      operationId: getTaskControl
      description: Foreign task or control identifiers return the same non-revealing `404` shape as unknown identifiers.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/ControlId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      responses:
        '200':
          description: Team-owned control record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Control'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /v1/environments:
    post:
      tags: [Environments]
      summary: Create a team-owned environment definition
      operationId: createEnvironment
      description: |
        Stores non-secret `KEY=value` entries and optional project/task
        applicability in the trusted Gateway team. The body cannot select a
        tenant. The write appends a plaintext-free audit entry.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentWriteRequest'
      responses:
        '201':
          description: Environment definition created and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
    get:
      tags: [Environments]
      summary: List team-owned environment definitions
      operationId: listEnvironments
      description: Team filtering occurs before project/task filters, totals, cursors, and pages.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
        - $ref: '#/components/parameters/ProjectIdFilter'
        - $ref: '#/components/parameters/TaskIdFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Team-filtered environment page, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvironmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'

  /v1/environments/{environment_id}:
    get:
      tags: [Environments]
      summary: Read environment metadata and non-secret values
      operationId: getEnvironment
      description: |
        Returns team-owned metadata, non-secret values, and logical secret
        references only. It never returns secret plaintext, decrypted values,
        Transit ciphertext, or key material. A foreign identifier is the same
        `404` shape as unknown.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      responses:
        '200':
          description: Team-owned environment without secret plaintext.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    put:
      tags: [Environments]
      summary: Replace a team-owned non-secret environment definition
      operationId: replaceEnvironment
      description: A foreign environment returns non-revealing `404` and causes no OpenBao operation.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvironmentWriteRequest'
      responses:
        '200':
          description: New environment revision stored and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Environment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    delete:
      tags: [Environments]
      summary: Delete a team-owned environment definition
      operationId: deleteEnvironment
      description: Marks the definition deleted and appends an audit entry; foreign is indistinguishable from unknown.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      responses:
        '204':
          description: Environment marked deleted; no response body.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /v1/environments/{environment_id}/secrets:
    post:
      tags: [Secrets]
      summary: Create a logical secret and immutable encrypted version
      operationId: createEnvironmentSecret
      description: |
        Accepted only for a same-team environment. State Registry verifies team
        ownership and applicability before sending plaintext over mTLS to OpenBao
        Transit. It stores a logical secret plus an immutable ciphertext version,
        but returns only identifiers and non-sensitive version metadata. A foreign
        environment returns non-revealing `404` before any OpenBao call.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreateRequest'
      responses:
        '201':
          description: Logical secret and first immutable encrypted version created and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    get:
      tags: [Secrets]
      summary: List logical secret metadata for an environment
      operationId: listEnvironmentSecrets
      description: Returns references and version metadata only; no plaintext or Transit ciphertext.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Team-filtered logical-secret page, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogicalSecretPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /v1/environments/{environment_id}/secrets/{secret_id}:
    get:
      tags: [Secrets]
      summary: Read logical secret metadata
      operationId: getEnvironmentSecret
      description: Returns no plaintext, decrypted value, Transit ciphertext, or decryption material.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/SecretId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      responses:
        '200':
          description: Team-owned logical secret metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogicalSecret'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    put:
      tags: [Secrets]
      summary: Append an immutable replacement secret version
      operationId: replaceEnvironmentSecretValue
      description: |
        The logical secret remains stable; State Registry appends a new immutable
        OpenBao-encrypted version and returns metadata only. Foreign parent or
        secret identifiers return `404` before any OpenBao call.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/SecretId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretReplaceRequest'
      responses:
        '200':
          description: New immutable encrypted version appended and audited.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretWriteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'
    delete:
      tags: [Secrets]
      summary: Revoke a logical secret reference
      operationId: revokeEnvironmentSecret
      description: Retains immutable version history, stores no plaintext, and appends a plaintext-free audit entry.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/SecretId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      responses:
        '204':
          description: Logical secret revoked; immutable history retained.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /v1/environments/{environment_id}/secrets/{secret_id}/versions:
    get:
      tags: [Secrets]
      summary: List immutable secret-version metadata
      operationId: listSecretVersions
      description: Version metadata is team-filtered and contains no plaintext or Transit ciphertext.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/SecretId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Team-filtered immutable version page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersionPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /v1/environments/{environment_id}/secrets/{secret_id}/versions/{version}:
    get:
      tags: [Secrets]
      summary: Read immutable secret-version metadata
      operationId: getSecretVersion
      description: A foreign version identifier returns the same `404` shape as unknown and never exposes plaintext or ciphertext.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/SecretId'
        - $ref: '#/components/parameters/SecretVersionNumber'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      responses:
        '200':
          description: Team-owned immutable version metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretVersion'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /v1/environments/{environment_id}/open:
    get:
      tags: [Environments]
      summary: Open task-scoped environment values for the assigned Executor
      operationId: openAssignedEnvironment
      description: |
        This is the only public operation that returns decrypted secret values.
        The caller must be the authenticated Executor currently assigned to the
        referenced task in the same immutable team, and the task must still be
        in a non-terminal state (`dispatched` or `running`).

        The required `X-FlowAI-Scope-Token` header carries the compact
        three-part scope token issued with the original approval response in
        the documented `<header>.<payload>.<signature>` shape. The `<header>`
        segment declares the allowed `alg` (the allow-listed HMAC set
        `HS256`/`HS384`/`HS512` only — matching the "HMAC-SHA-256 or a stronger
        HMAC" model), the active `kid`, and the token `typ`. The `<payload>`
        segment carries every bound claim: `team_id`, `project_id`, `task_id`,
        `environment_id`, `executor_id`, `audience`
        (`state-registry.environment.open`), `key_id`, `issued_at`, and
        `expiry`. `project_id` is a required claim but its value is nullable
        only when the canonical environment has no project scope; a missing
        `project_id` claim is malformed, while a null value for a
        project-scoped environment or any non-null mismatch is invalid.
        `issued_at` MUST be a moment not in the future beyond the tolerated
        clock-skew window of 30 seconds (`issued_at <= server_now + 30s`),
        `expiry` MUST be strictly later than `issued_at`, and
        `expiry - issued_at` MUST be no more than five minutes; tokens whose
        lifetime exceeds that bound, are expired, or are premature beyond the
        skew window are rejected together with all other invalid cases.

        State Registry recomputes the signature using the declared allow-listed
        `alg`, the server-side key handle identified by `key_id` (loaded once
        per process from a sealed source and held in protected memory), and
        compares the result with the supplied `<signature>` using a
        constant-time comparison before any other check and before any OpenBao
        call. Before recomputing, State Registry verifies that the
        protected-header `kid` equals the payload `key_id`; any mismatch is
        rejected without performing the MAC comparison or any OpenBao
        operation. The active `key_id` is rotated independently of any token
        lifetime; retired or unknown `key_id` values are rejected before
        decryption.

        To prevent an oracle that would otherwise distinguish the failure
        reason, every invalid or unavailable case returns one closed,
        non-revealing `404 environment_unknown_or_unavailable` response. This
        covers a tampered signature, an algorithm outside the allow-listed
        `HS256`/`HS384`/`HS512` HMAC set, a protected-header `kid` that does
        not equal the payload `key_id`, a bad HMAC, a wrong or retired
        `key_id`, an expired, premature-beyond-skew, or over-five-minute
        token, an unexpected audience, a missing or mismatched claim, a
        project-scoped environment with a null `project_id`, a wrong
        authenticated Executor identity, an unassigned or already-replaced
        Executor, a terminal task state, and a foreign or unknown environment
        or task identifier. No OpenBao call is started before every check has
        passed.

        On success, State Registry returns env-style values and appends a
        plaintext-free audit entry. Plaintext remains in memory only.
      security:
        - ExecutorMTLS: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - name: X-FlowAI-Scope-Token
          in: header
          required: true
          description: |
            Compact three-part scope token `<header>.<payload>.<signature>`
            from the successful approval response. The header segment carries
            `alg` (allow-listed `HS256`/`HS384`/`HS512`), `kid`, and `typ`;
            the payload segment carries every bound claim (`team_id`,
            `project_id`, `task_id`, `environment_id`, `executor_id`,
            `audience`, `key_id`, `issued_at`, `expiry`). Treat as confidential
            and never log it. Any invalid or unavailable case returns a
            single closed `404 environment_unknown_or_unavailable` response
            without revealing which check failed.
          schema:
            $ref: '#/components/schemas/CompactScopeToken'
        - name: task_id
          in: query
          required: true
          description: Identifier of the assigned task; the path `environment_id` is resolved against the canonical environment row.
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Authorized non-secret and decrypted env-style values for the assigned, non-terminal task only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenEnvironmentResponse'
        '204':
          description: The authorized environment has no values to return.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/EnvironmentUnknownOrUnavailable'

  /v1/audit:
    get:
      tags: [Audit]
      summary: List plaintext-free audit entries in the operator team
      operationId: listAuditEntries
      description: Team filtering occurs before actor/resource/time filters, totals, cursors, aggregation, or serialization.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: resource_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Identifier'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Team-filtered audit page, possibly empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'

  /v1/audit/{audit_id}:
    get:
      tags: [Audit]
      summary: Read one plaintext-free audit entry
      operationId: getAuditEntry
      description: A foreign audit identifier returns the same `404` shape as unknown and discloses no entry.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/AuditId'
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
      responses:
        '200':
          description: Team-owned plaintext-free audit entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

  /v1/events/stream:
    get:
      tags: [Subscriptions]
      summary: Upgrade to a team-bound event WebSocket
      operationId: streamTeamEvents
      description: |
        Accepted only from the trusted API Gateway service identity. The
        `X-FlowAI-Operator-ID`, `X-FlowAI-Team-ID`, and `X-FlowAI-Request-ID`
        headers are required at upgrade; the connection is permanently bound
        to `X-FlowAI-Team-ID`. `X-FlowAI-Team-Name` is optional and, when
        present, is display-only; its absence never affects authorization or
        frame filtering. The immutable team predicate is applied before
        replay selection, cursor handling, filters, live fan-out, and every
        frame. Each `WebSocketEventFrame` requires the same `team_id`. A
        filter naming a foreign resource is treated as unknown and emits no
        existence signal or foreign frame.
      security:
        - GatewayMTLS: []
      parameters:
        - $ref: '#/components/parameters/GatewayOperatorId'
        - $ref: '#/components/parameters/GatewayTeamId'
        - $ref: '#/components/parameters/GatewayTeamName'
        - $ref: '#/components/parameters/GatewayRequestId'
        - name: cursor
          in: query
          required: false
          description: Opaque team-scoped replay cursor. A cursor from another team is invalid.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: event_kind
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StreamEventKind'
          style: form
          explode: false
        - name: resource_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Identifier'
      responses:
        '101':
          description: |
            WebSocket upgrade accepted. Every text frame is JSON matching
            `WebSocketEventFrame` and belongs to the team fixed at upgrade.
          headers:
            Upgrade:
              required: true
              schema:
                const: websocket
            Connection:
              required: true
              schema:
                const: Upgrade
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/NotAuthorized'
        '404':
          $ref: '#/components/responses/ResourceNotFound'

components:
  securitySchemes:
    ListenerMTLS:
      type: mutualTLS
      description: Trusted listener certificate bound to exactly one immutable team and authorized source.
    ExecutorMTLS:
      type: mutualTLS
      description: Trusted Executor certificate bound to exactly one immutable team and Executor identity.
    GatewayMTLS:
      type: mutualTLS
      description: Trusted API Gateway certificate. Internal context headers are trusted only with this identity.

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ExecutorId:
      name: executor_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    EnvironmentId:
      name: environment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SecretId:
      name: secret_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    ControlId:
      name: control_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    AuditId:
      name: audit_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Identifier'
    SecretVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GatewayOperatorId:
      name: X-FlowAI-Operator-ID
      in: header
      required: true
      description: Gateway-verified operator identifier. Trusted only with `GatewayMTLS`; one operator context has exactly one team.
      schema:
        $ref: '#/components/schemas/Identifier'
    GatewayTeamId:
      name: X-FlowAI-Team-ID
      in: header
      required: true
      description: Immutable authoritative tenant identifier injected by the trusted Gateway. This is the only Gateway tenant authorization input.
      schema:
        $ref: '#/components/schemas/TeamId'
    GatewayTeamName:
      name: X-FlowAI-Team-Name
      in: header
      required: false
      description: |
        Optional Gateway-verified display and audit label. When present the
        Registry retains it for display and audit context only. It must
        never select, grant, or broaden tenant access, and its absence never
        weakens authorization anchored to `X-FlowAI-Team-ID`.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    GatewayRequestId:
      name: X-FlowAI-Request-ID
      in: header
      required: true
      description: Gateway-generated request correlation identifier included in audit and errors; it conveys no authorization.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor computed only after the authenticated team predicate.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TagFilter:
      name: tag
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Tag'
    SourceFilter:
      name: source
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TaskStateFilter:
      name: state
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TaskState'
    ProjectIdFilter:
      name: project_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Identifier'
    TaskIdFilter:
      name: task_id
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Identifier'

  responses:
    BadRequest:
      description: Request path, query, headers, or body are invalid. No sensitive free-form detail is returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: A trusted mutually authenticated service identity was not established.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAuthorized:
      description: The authenticated service role, team binding, tag, or scope is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAssigned:
      description: The authenticated same-team Executor is not the immutable task assignee.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskNotFound:
      description: Unknown or foreign-team task. Both cases use exactly the same status and closed response shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: task_unknown
            message: Task was not found.
            request_id: req-redacted
    ExecutorNotFound:
      description: Unknown or foreign-team Executor. Both cases use exactly the same status and closed response shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: executor_unknown
            message: Executor was not found.
            request_id: req-redacted
    ResourceNotFound:
      description: Unknown or foreign-team resource. Both cases use exactly the same status and closed response shape.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: resource_unknown
            message: Resource was not found.
            request_id: req-redacted
    TaskAlreadyDispatched:
      description: The task is no longer `created`; no assignment or event is changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: task_already_dispatched
            message: Task is no longer available for approval.
            request_id: req-redacted
    InvalidTaskTransition:
      description: Lifecycle transition or ordering tuple is invalid; no event or projection change occurs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: invalid_task_transition
            message: Task event cannot be accepted in the current state.
            request_id: req-redacted
    Conflict:
      description: The request conflicts with immutable or current resource state; no partial mutation occurs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TeamMismatch:
      description: |
        The authenticated Executor envelope `team_id` does not match the
        Executor's immutable service-binding `team_id`; no event is appended
        and no projection changes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: team_mismatch
            message: Authenticated envelope team identity does not match this Executor.
            request_id: req-redacted
    EnvironmentUnknownOrUnavailable:
      description: |
        Single closed non-revealing `404` response used for every invalid or
        unavailable case at `GET /v1/environments/{environment_id}/open`,
        including tampered signature, an algorithm outside the allow-listed
        `HS256`/`HS384`/`HS512` HMAC set, a protected-header `kid` that does
        not equal the payload `key_id`, bad HMAC, wrong or retired `key_id`,
        expired, premature-beyond-skew, or over-five-minute token, unexpected
        audience, missing or mismatched claim (including a project-scoped
        environment with a null `project_id`), wrong authenticated Executor
        identity, unassigned or already-replaced Executor, terminal task
        state, and a foreign or unknown environment or task identifier.
        The response shape and `code` are identical for every case so the
        endpoint cannot be used as a validation oracle. No OpenBao call is
        started before every check has passed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: environment_unknown_or_unavailable
            message: Environment was not found or is not available.
            request_id: req-redacted

  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'

    TeamId:
      allOf:
        - $ref: '#/components/schemas/Identifier'
      description: Immutable tenant identifier and sole team authorization authority.

    Tag:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'

    JsonPayload:
      type: object
      additionalProperties: true
      description: Domain payload. Secret plaintext and decrypted environment values are forbidden.

    TaskState:
      type: string
      enum: [created, dispatched, running, finished, failed]

    TaskIngestionRequest:
      type: object
      additionalProperties: false
      required: [team_id, source, source_task_id, required_tag, payload]
      properties:
        team_id:
          $ref: '#/components/schemas/TeamId'
        source:
          type: string
          minLength: 1
          maxLength: 128
