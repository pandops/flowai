          oneOf:
            - $ref: '#/components/schemas/TaskEvent'
            - $ref: '#/components/schemas/ExecutorEvent'
            - $ref: '#/components/schemas/Control'
            - $ref: '#/components/schemas/AuditEntry'
      description: Every frame's `team_id` must equal the immutable Gateway team bound at upgrade.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]*$'
        message:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable non-sensitive summary only; no database, stack, tenant, secret, or decrypted-value detail.
        request_id:
          type: string
          minLength: 1
          maxLength: 128
      description: Closed error envelope. Free-form details and sensitive context are forbidden.
