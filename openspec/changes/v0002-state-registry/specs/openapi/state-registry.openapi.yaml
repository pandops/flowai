    ApprovalRequest:
      type: object
      additionalProperties: false
      required: [task_id]
      properties:
        task_id:
          $ref: '#/components/schemas/Identifier'

    ScopeTokenAlgorithm:
      type: string
      enum: [HS256, HS384, HS512]
      description: |
        Allow-listed HMAC algorithm for the open-environment scope token.
        The contract accepts only `HS256`, `HS384`, or `HS512` — the
        "HMAC-SHA-256 or a stronger HMAC" family. Any other value, including
        asymmetric algorithms and non-allow-listed HMAC variants, is rejected
        by the same non-revealing `404 environment_unknown_or_unavailable`
        response as every other invalid case. The Registry recomputes the
        signature using exactly the algorithm declared by the protected
        header.

    ScopeTokenType:
      type: string
      const: scope-token+json
      description: Required token media type; any other value is rejected.

    ScopeTokenHeader:
      type: object
      additionalProperties: false
      required: [alg, kid, typ]
      properties:
        alg:
          $ref: '#/components/schemas/ScopeTokenAlgorithm'
        kid:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          description: Active signing-key identifier used by the server-side key handle; never returned to callers in plan or logs.
        typ:
          $ref: '#/components/schemas/ScopeTokenType'

    ScopeTokenAudience:
      type: string
      const: state-registry.environment.open

    ScopeTokenClaims:
      type: object
      additionalProperties: false
      required: [team_id, project_id, task_id, environment_id, executor_id, audience, key_id, issued_at, expiry]
      properties:
        team_id:
          $ref: '#/components/schemas/TeamId'
        project_id:
          anyOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
          description: |
            Required claim. The value is nullable only when the canonical
            environment has no project scope; a missing `project_id` claim is
            rejected as malformed, and a null value for a project-scoped
            environment or any non-null mismatch with canonical records is
            rejected as invalid.
        task_id:
          $ref: '#/components/schemas/Identifier'
        environment_id:
          $ref: '#/components/schemas/Identifier'
        executor_id:
          $ref: '#/components/schemas/Identifier'
        audience:
          $ref: '#/components/schemas/ScopeTokenAudience'
        key_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          description: |
            Active signing-key identifier carried in the payload. The Registry
            verifies that this value equals the protected-header `kid` before
            recomputing the MAC; a mismatch is rejected by the same
            non-revealing `404 environment_unknown_or_unavailable` response
            before any other check and before any OpenBao operation.
        issued_at:
          type: string
          format: date-time
          description: |
            Server-side issuance instant. `issued_at` MUST satisfy
            `issued_at <= server_now + 30s` (tolerated clock-skew window of
            30 seconds) and `expiry` MUST be strictly later than `issued_at`.
        expiry:
          type: string
          format: date-time
          description: |
            Absolute expiry instant. The Registry rejects any token whose
            lifetime exceeds five minutes (`expiry - issued_at <= 5 minutes`),
            whose `expiry` is not strictly later than `issued_at`, or whose
            `issued_at` is premature beyond 30 seconds of clock skew.
            Token refresh requires a new approval response rather than a new
            token over the same task.

    CompactScopeToken:
      type: string
      minLength: 32
      maxLength: 8192
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      description: |
        Compact three-part scope token
        `<header>.<payload>.<signature>` carried in the
        `X-FlowAI-Scope-Token` header. The header segment must decode to
        `ScopeTokenHeader` (`alg` allow-listed to `HS256`/`HS384`/`HS512`,
        `kid`, `typ = scope-token+json`) and the payload segment must
        decode to `ScopeTokenClaims` with every bound claim (`team_id`,
        `project_id`, `task_id`, `environment_id`, `executor_id`, `audience =
        state-registry.environment.open`, `key_id`, `issued_at`, `expiry`)
        and `issued_at <= server_now + 30s`, `expiry > issued_at`,
        `expiry - issued_at <= 5 minutes`. The Registry first verifies that
        the protected-header `kid` equals the payload `key_id`; any
        mismatch is rejected before MAC recomputation and before any
        OpenBao operation. The `<signature>` segment is then recomputed
        under the declared allow-listed HMAC algorithm and the
        server-side key handle identified by `key_id`; it is compared with
        constant-time equality before any OpenBao call. Treat the value as
        confidential and never log it.

    ApprovalResponse:
      type: object
      additionalProperties: false
      required: [approval, task, environment_id, scope_token, approved_at]
      properties:
        approval:
          const: approved
        task:
          $ref: '#/components/schemas/Task'
        environment_id:
          anyOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        scope_token:
          anyOf:
            - $ref: '#/components/schemas/CompactScopeToken'
            - type: 'null'
          description: |
            Compact scope token (single string of the form
            `<header>.<payload>.<signature>`) issued by State Registry and
            signed with an allow-listed HMAC algorithm (`HS256`, `HS384`, or
            `HS512`) under a server-controlled rotating key. The Executor
            must carry it in the `X-FlowAI-Scope-Token` header of
            `GET /v1/environments/{environment_id}/open`. Present only when
            the approved task references an applicable environment. Treat
            as confidential and never log it.
        approved_at:
          type: string
          format: date-time

