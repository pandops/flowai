openapi: 3.1.0
info:
  title: FlowAI Docker Executor Local API
  version: v0001-proposed
  license:
    name: Internal planning artifact
    identifier: LicenseRef-Internal-Planning
  summary: Proposed platform health-probe API exposed by the v0001 Docker Executor MVP.
  description: |
    This OpenAPI document covers only the Docker Executor's own platform health
    probe API: `/livez` for liveness and `/readyz` for readiness.
    The Executor does not proxy OpenHands and does not expose task-control
    endpoints. It pulls task start, interrupt, and message actions from the
    Router surface and posts its own executor/task lifecycle events to the
    State Registry surface.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

security: []

servers:
  - url: http://127.0.0.1:8020/v1
    description: Executor localhost platform health API (v0001 only)

tags:
  - name: Executor API
    description: Platform health-probe API exposed by the Docker Executor process.

paths:
  /livez:
    get:
      tags: [Executor API]
      summary: Executor liveness.
      description: Returns 200 if the Executor process is alive. The response is about the Go Executor process, not OpenHands internals or Python runtime readiness.
      operationId: getExecutorLiveness
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Executor process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        default:
          $ref: '#/components/responses/DefaultError'

  /readyz:
    get:
      tags: [Executor API]
      summary: Executor readiness.
      description: Returns 200 when the Executor is ready to list Router workload and execute it through owned OpenHands containers. This is the Executor's own readiness, not an OpenHands proxy endpoint.
      operationId: getExecutorReadiness
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Executor is ready to list and execute workload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/DefaultError'

components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-provided request correlation identifier echoed in error responses and logs.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    BadRequest:
      description: Request path, query, headers, or body are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Executor process is alive but not ready to pull and execute workload.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DefaultError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LivenessResponse:
      type: object
      required: [status, executor_id]
      properties:
        status:
          const: ok
        executor_id:
          type: string
          description: Unique Executor process UID generated by the Executor at startup.

    ReadinessResponse:
      type: object
      required: [status, executor_id, state_registry_registered, openhands_reachable]
      properties:
        status:
          const: ready
        executor_id:
          type: string
          description: Unique Executor process UID generated by the Executor at startup.
        state_registry_registered:
          type: boolean
        openhands_reachable:
          type: boolean

    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        request_id:
          type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
