openapi: 3.1.0
info:
  title: FlowAI Mocked Env Registry Surface API
  version: v0001-proposed
  license:
    name: Internal planning artifact
    identifier: LicenseRef-Internal-Planning
  summary: Proposed mocked Env Registry env-read endpoint called by the v0001 Docker Executor.
  description: |
    This OpenAPI document covers only the mocked Env Registry surface used by
    the v0001 Docker Executor to read environment values before OpenHands
    container start. The real Env Registry is introduced by a later numbered
    change.

    All paths are URI-versioned under `/v1`, return
    standard HTTP status codes, and share a common error envelope with request
    correlation metadata.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

security: []

servers:
  - url: http://127.0.0.1:8080/v1
    description: Mocked Env Registry surface exposed by the v0001 mocked task server

tags:
  - name: Env Registry Surface
    description: Mocked Env Registry endpoint called by the Executor to read environment values before container start.

paths:
  /env:
    get:
      tags: [Env Registry Surface]
      summary: Read environment values before OpenHands start.
      description: Called by the Executor before starting an OpenHands container.
      operationId: getEnvironment
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/ExecutorId'
        - $ref: '#/components/parameters/RoutingTarget'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/ScopeToken'
      responses:
        '200':
          description: Environment values returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenEnvResponse'
        '204':
          description: No environment values are configured for this Executor.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/DefaultError'

components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Optional caller-provided request correlation identifier echoed in error responses and logs.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ExecutorId:
      name: executor_id
      in: query
      required: true
      description: Unique Executor process UID generated by the Executor at startup.
      schema:
        type: string
        minLength: 1
    RoutingTarget:
      name: routing_target
      in: query
      required: true
      description: Routing tag used by the Executor.
      schema:
        type: string
        minLength: 1
    TaskId:
      name: task_id
      in: query
      required: false
      description: FlowAI platform task identifier when env values are task-scoped.
      schema:
        type: string
        format: uuid
    ScopeToken:
      name: scope_token
      in: query
      required: true
      description: Env Registry scope token authorizing access to the configured environment values.
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Request path, query, headers, or body are invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Requested resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DefaultError:
      description: Unexpected error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OpenEnvResponse:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties:
            type: string

    ErrorResponse:
      type: object
      required: [error, request_id]
      properties:
        request_id:
          type: string
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
