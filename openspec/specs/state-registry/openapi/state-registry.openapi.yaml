  /v1/environments/{environment_id}/open:
    get:
      tags: [Environments]
      summary: Open task-scoped environment values for the assigned Executor
      operationId: openAssignedEnvironment
      description: |
        This is the only public operation that returns decrypted secret
        values. The caller must be the authenticated Executor currently
        assigned to the referenced task in the same immutable team, and
        the task must still be in a non-terminal state
        (`created` or `running`).

        The required `X-FlowAI-Scope-Token` header carries the compact
        three-part scope token issued with the original successful claim
        response in the documented
        `<header>.<payload>.<signature>` shape. The `<header>` segment
        declares the allowed `alg` (the allow-listed HMAC set
        `HS256`/`HS384`/`HS512` only — matching the "HMAC-SHA-256 or a
        stronger HMAC" model), the active `kid`, and the token `typ`.
        The `<payload>` segment carries every bound claim: `team_id`,
        `project_id`, `task_id`, `environment_id`, `executor_id`,
        `audience` (`state-registry.environment.open`), `key_id`,
        `issued_at`, and `expiry`. `project_id` is a required claim but
        its value is nullable only when the canonical environment has no
        project scope; a missing `project_id` claim is malformed, while
        a null value for a project-scoped environment or any non-null
        mismatch is invalid. `issued_at` MUST be a moment not in the
        future beyond the tolerated clock-skew window of 30 seconds
        (`issued_at <= server_now + 30s`), `expiry` MUST be strictly
        later than `issued_at`, and `expiry - issued_at` MUST be no more
        than five minutes; tokens whose lifetime exceeds that bound, are
        expired, or are premature beyond the skew window are rejected
        together with all other invalid cases.

        State Registry recomputes the signature using the declared
        allow-listed `alg`, the server-side HMAC key handle identified
        by `key_id` (loaded once per process from a sealed source and
        held in protected memory), and compares the result with the
        supplied `<signature>` using a constant-time comparison before
        any other check and before any decrypt operation. Before
        recomputing, State Registry verifies that the protected-header
        `kid` equals the payload `key_id`; any mismatch is rejected
        without performing the MAC comparison or any decrypt operation.
        The active `key_id` is rotated independently of any token
        lifetime; retired or unknown `key_id` values are rejected before
        decryption.

        To prevent an oracle that would otherwise distinguish the
        failure reason, every invalid or unavailable case returns one
        closed, non-revealing `404 environment_unknown_or_unavailable`
        response. This covers a tampered signature, an algorithm outside
        the allow-listed `HS256`/`HS384`/`HS512` HMAC set, a
        protected-header `kid` that does not equal the payload
        `key_id`, a bad HMAC, a wrong or retired `key_id`, an expired,
        premature-beyond-skew, or over-five-minute token, an unexpected
        audience, a missing or mismatched claim (including a
        project-scoped environment with a null `project_id`), a wrong
        authenticated Executor identity, an unassigned or
        already-replaced Executor, a terminal task state, and a foreign
        or unknown environment or task identifier. No decrypt operation
        is started before every check has passed. The local AES-256-GCM
        decrypt runs with associated-data binding team identifier,
        logical secret identifier, and version, and only on the
        successful path; no decrypt operation runs for any invalid or
        unavailable case.

        On success, State Registry returns env-style values and appends
        a plaintext-free audit entry. Plaintext remains in memory only.
      parameters:
        - $ref: "#/components/parameters/EnvironmentId"
        - name: X-FlowAI-Scope-Token
          in: header
          required: true
          description: |
            Compact three-part scope token
            `<header>.<payload>.<signature>` from the successful claim
            response. The header segment carries `alg` (allow-listed
            `HS256`/`HS384`/`HS512`), `kid`, and `typ`; the payload
            segment carries every bound claim (`team_id`, `project_id`,
            `task_id`, `environment_id`, `executor_id`, `audience`,
            `key_id`, `issued_at`, `expiry`). Treat as confidential and
            never log it. Any invalid or unavailable case returns a
            single closed `404 environment_unknown_or_unavailable`
            response without revealing which check failed.
          schema:
            $ref: "#/components/schemas/CompactScopeToken"
        - name: task_id
          in: query
          required: true
          description: Identifier of the assigned task; the path `environment_id` is resolved against the canonical environment row.
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "200":
          description: Authorized non-secret and decrypted env-style values for the assigned, non-terminal task only.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenEnvironmentResponse"
        "204":
          description: The authorized environment has no values to return.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/EnvironmentUnknownOrUnavailable"

  /v1/audit:
    get:
      tags: [Audit]
      summary: List plaintext-free audit entries in the operator team
      operationId: listAuditEntries
      description: Team filtering occurs before actor/resource/time filters, totals, cursors, aggregation, or serialization.
      parameters:
        - $ref: "#/components/parameters/GatewayOperatorId"
        - $ref: "#/components/parameters/GatewayTeamId"
        - $ref: "#/components/parameters/GatewayTeamName"
        - $ref: "#/components/parameters/GatewayRequestId"
        - name: resource_type
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: resource_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Identifier"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Team-filtered audit page, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"

  /v1/audit/{audit_id}:
    get:
      tags: [Audit]
      summary: Read one plaintext-free audit entry
      operationId: getAuditEntry
      description: A foreign audit identifier returns the same `404` shape as unknown and discloses no entry.
      parameters:
        - $ref: "#/components/parameters/AuditId"
        - $ref: "#/components/parameters/GatewayOperatorId"
        - $ref: "#/components/parameters/GatewayTeamId"
        - $ref: "#/components/parameters/GatewayTeamName"
        - $ref: "#/components/parameters/GatewayRequestId"
      responses:
        "200":
          description: Team-owned plaintext-free audit entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/ResourceNotFound"

  /v1/events/stream:
    get:
      tags: [Subscriptions]
      summary: Upgrade to a team-bound event WebSocket
      operationId: streamTeamEvents
      description: |
        Accepted only from the trusted API Gateway service identity. The
        `X-FlowAI-Operator-ID`, `X-FlowAI-Team-ID`, and `X-FlowAI-Request-ID`
        headers are required at upgrade; the connection is permanently
        bound to `X-FlowAI-Team-ID`. `X-FlowAI-Team-Name` is optional and,
        when present, is display-only; its absence never affects
        authorization or frame filtering. The immutable team predicate is
        applied before replay selection, cursor handling, filters, live
        fan-out, and every frame. Each `WebSocketEventFrame` requires the
        same `team_id`. A filter naming a foreign resource is treated as
        unknown and emits no existence signal or foreign frame.
      parameters:
        - $ref: "#/components/parameters/GatewayOperatorId"
        - $ref: "#/components/parameters/GatewayTeamId"
        - $ref: "#/components/parameters/GatewayTeamName"
        - $ref: "#/components/parameters/GatewayRequestId"
        - name: cursor
          in: query
          required: false
          description: Opaque team-scoped replay cursor. A cursor from another team is invalid.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: event_kind
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/StreamEventKind"
          style: form
          explode: false
        - name: resource_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Identifier"
      responses:
        "101":
          description: |
            WebSocket upgrade accepted. Every text frame is JSON matching
            `WebSocketEventFrame` and belongs to the team fixed at upgrade.
          headers:
            Upgrade:
              required: true
              schema:
                const: websocket
            Connection:
              required: true
              schema:
                const: Upgrade
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/ResourceNotFound"

components:
  securitySchemes: {}

  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ExecutorId:
      name: executor_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    EnvironmentId:
      name: environment_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SecretId:
      name: secret_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ControlId:
      name: control_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    AuditId:
      name: audit_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    SecretVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    GatewayOperatorId:
      name: X-FlowAI-Operator-ID
      in: header
      required: true
      description: Gateway-forwarded operator identifier; one operator context has exactly one team.
      schema:
        $ref: "#/components/schemas/Identifier"
    GatewayTeamId:
      name: X-FlowAI-Team-ID
      in: header
      required: true
      description: Immutable authoritative tenant identifier injected by the trusted Gateway. This is the only Gateway tenant authorization input.
      schema:
        $ref: "#/components/schemas/TeamId"
    GatewayTeamName:
      name: X-FlowAI-Team-Name
      in: header
      required: false
      description: |
        Optional Gateway-verified display and audit label. When present the
        Registry retains it for display and audit context only. It must
        never select, grant, or broaden tenant access, and its absence never
        weakens authorization anchored to `X-FlowAI-Team-ID`.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    GatewayRequestId:
      name: X-FlowAI-Request-ID
      in: header
      required: true
      description: Gateway-generated request correlation identifier included in audit and errors; it conveys no authorization.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor computed only after the authenticated team predicate,
        integrity-protected under a server-controlled HMAC keyed by
        `key_id`, and bound to this endpoint, the trusted Gateway
        `team_id` plus verified `operator_id`, the complete filter
        tuple, the deterministic ordering, and the forward page
        direction. A tampered, cross-endpoint, cross-scope,
        changed-filter, or wrong-direction cursor is rejected with the
        same non-revealing `400 invalid_pagination` response shape
        before any protected query runs.
      schema:
        type: string
        minLength: 1
        maxLength: 1536
    Limit:
      name: limit
      in: query
      required: false
      description: |
        Page size; default 50, maximum 200. Out-of-range, non-integer,
        or otherwise malformed values are rejected with `400
        invalid_pagination` before any protected query runs.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TagFilter:
      name: tag
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Tag"
    TaskStateFilter:
      name: state
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/TaskState"
    ProjectIdFilter:
      name: project_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Identifier"
    TaskIdFilter:
      name: task_id
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/Identifier"
    AdminCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque cursor for `/admin/tags` and `/admin/tasks` pagination.
        Cursors are computed only from canonical rows visible to the
        authenticated system-administrator role. Each cursor is
        integrity-protected under a server-controlled HMAC keyed by
        `key_id`, bound to the originating endpoint, the
        authenticated system-administrator role, the complete filter
        tuple, the deterministic endpoint ordering, and the forward
        page direction; a tampered, cross-endpoint, cross-role,
        changed-filter, or wrong-direction cursor is rejected with the
        same non-revealing `400 invalid_pagination` shape before any
        protected query runs.
      schema:
        type: string
        minLength: 1
        maxLength: 1536
    AdminLimit:
      name: limit
      in: query
      required: false
      description: |
        Page size for `/admin/tags` and `/admin/tasks`. Default 50,
        maximum 200. Out-of-range, non-integer, or otherwise malformed
        values are rejected with `400 invalid_pagination` before any
        row is read; the response carries no payload, secret,
        decrypted environment value, or event history.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AdminTagTeamIdFilter:
      name: team_id
      in: query
      required: false
      description: |
        Optional exact-match filter for `GET /admin/tags`; restricts the
        tag page to a single team.
      schema:
        $ref: "#/components/schemas/TeamId"
    AdminTagTagFilter:
      name: tag
      in: query
      required: false
      description: |
        Optional exact-match `execution_tag` filter for `GET
        /admin/tags`. Equal tag strings appearing under different
        `team_id`s SHALL NOT grant cross-team authority.
      schema:
        $ref: "#/components/schemas/Tag"
    AdminTaskTeamIdFilter:
      name: team_id
      in: query
      required: false
      description: |
        Optional exact-match filter for `GET /admin/tasks`; restricts
        the task page to a single team.
      schema:
        $ref: "#/components/schemas/TeamId"
    AdminTaskStateFilter:
      name: state
      in: query
      required: false
      description: |
        Optional exact-match filter for `GET /admin/tasks`; restricts
        the task page to one canonical `current_state`.
      schema:
        $ref: "#/components/schemas/TaskState"
    AdminTaskTagFilter:
      name: tag
      in: query
      required: false
      description: |
        Optional exact-match `required_tag` filter for `GET
        /admin/tasks`. Equal tag strings across teams SHALL NOT grant
        cross-team authority.
      schema:
        $ref: "#/components/schemas/Tag"
    AdminTaskTypeIdFilter:
      name: task_type_id
      in: query
      required: false
      description: |
        Optional exact-match filter for `GET /admin/tasks`; restricts
        the task page to a single registered task type.
      schema:
        $ref: "#/components/schemas/TaskTypeId"

  responses:
    BadRequest:
      description: Request path, query, headers, or body are invalid. No sensitive free-form detail is returned.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: A trusted mutually authenticated service identity was not established.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotAuthorized:
      description: The authenticated service role, team binding, tag, or scope is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotAssigned:
      description: The authenticated same-team Executor is not the immutable task assignee.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TaskNotFound:
      description: Unknown or foreign-team task. Both cases use exactly the same status and closed response shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: task_unknown
            message: Task was not found.
            request_id: req-redacted
    ExecutorNotFound:
      description: Unknown or foreign-team Executor. Both cases use exactly the same status and closed response shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: executor_unknown
            message: Executor was not found.
            request_id: req-redacted
    ResourceNotFound:
      description: Unknown or foreign-team resource. Both cases use exactly the same status and closed response shape.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: resource_unknown
            message: Resource was not found.
            request_id: req-redacted
    TaskAlreadyClaimed:
      description: |
        The task is no longer `pending` for the requester's scope; no
        assignment or event is changed. The same body covers both the
        non-oldest eligible FIFO conflict (`older_task_must_be_claimed_first`)
        and the stale-claim conflict (`task_already_claimed`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: older_task_must_be_claimed_first
            message: An older eligible pending task exists for this Executor; claim the oldest one first.
            request_id: req-redacted
    InvalidTaskTransition:
      description: Lifecycle transition or ordering tuple is invalid; no event or projection change occurs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: invalid_task_transition
            message: Task event cannot be accepted in the current state.
            request_id: req-redacted
    Conflict:
      description: The request conflicts with immutable or current resource state; no partial mutation occurs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    EnvironmentUnknownOrUnavailable:
      description: |
        Single closed non-revealing `404` response used for every invalid
        or unavailable case at
        `GET /v1/environments/{environment_id}/open`, including tampered
        signature, an algorithm outside the allow-listed `HS256`/`HS384`/`HS512`
        HMAC set, a protected-header `kid` that does not equal the payload
        `key_id`, bad HMAC, wrong or retired `key_id`, expired,
        premature-beyond-skew, or over-five-minute token, unexpected
        audience, missing or mismatched claim (including a project-scoped
        environment with a null `project_id`), wrong authenticated
        Executor identity, unassigned or already-replaced Executor,
        terminal task state, and a foreign or unknown environment or
        task identifier. The response shape and `code` are identical for
        every case so the endpoint cannot be used as a validation
        oracle. No decrypt operation is started before every check has
        passed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: environment_unknown_or_unavailable
            message: Environment was not found or is not available.
            request_id: req-redacted

  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"

    TeamId:
      allOf:
        - $ref: "#/components/schemas/Identifier"
      description: Immutable tenant identifier and sole team authorization authority.

    SourceSystemId:
      allOf:
        - $ref: "#/components/schemas/Identifier"
      description: Immutable server-assigned source-system identifier; one source-system identity belongs to exactly one team.

    TaskTypeId:
      allOf:
        - $ref: "#/components/schemas/Identifier"
      description: Immutable server-assigned task-type identifier; one task type belongs to exactly one team.

    CommandId:
      allOf:
        - $ref: "#/components/schemas/Identifier"
      description: Immutable command identifier supplied by the Executor at claim; one command MAY own multiple tasks while each task is limited to one command.

    Tag:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"

    ImageReference:
      type: object
      additionalProperties: false
      required: [repository, digest]
      properties:
        repository:
          type: string
          minLength: 1
          maxLength: 512
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*(:[A-Za-z0-9._-]+)?$"
          description: |
            Opaque container image repository path (registry host,
            namespace, image name, optional tag suffix). State Registry
            does not resolve, pull, verify, mutate, or interpret this
            string. Image strings are not team-owned resources; image
            equality or reuse SHALL NOT grant, select, or broaden access.
        digest:
          type: string
          minLength: 71
          maxLength: 71
          pattern: "^sha256:[A-Fa-f0-9]{64}$"
          description: |
            Immutable OCI digest (`sha256:` followed by 64 lowercase or
            uppercase hex characters). State Registry stores the value
            verbatim and does not compute, verify, or interpret the
            digest.
      description: |
        Opaque container image reference. The reference identifies an
        image by repository path plus immutable digest; State Registry
        stores and returns the value verbatim and never uses it to
        select, prioritize, schedule, or reject work.

    ImageSource:
      type: string
      enum:
        [task_override, task_type_default, source_system_default, team_default]
      description: |
        Origin of `tasks.resolved_image`. The Registry persists the
        value in `image_source` and exposes it in the claim response so
        the Executor never has to consult any other source.

    JsonPayload:
      type: object
      additionalProperties: true
      description: Domain payload. Secret plaintext and decrypted environment values are forbidden.

    AdminTeamCreateRequest:
      type: object
      additionalProperties: false
      required: [team_name, default_image]
      properties:
        team_name:
          type: string
          minLength: 1
          maxLength: 200
          description: |
            Display-only label, unique across teams. Always
            non-authoritative. State Registry SHALL NOT use `team_name`
            for any authorization decision.
        default_image:
          $ref: "#/components/schemas/ImageReference"

    AdminTeam:
      type: object
      additionalProperties: false
      required: [team_id, team_name, default_image, created_at, updated_at]
      properties:
        team_id:
          $ref: "#/components/schemas/TeamId"
        team_name:
          type: string
        default_image:
          $ref: "#/components/schemas/ImageReference"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminSourceSystemCreateRequest:
      type: object
      additionalProperties: false
      required: [team_id, listener_identity]
      properties:
        team_id:
          $ref: "#/components/schemas/TeamId"
          description: |
            Required reference to an existing immutable `team_id`. The
            Registry rejects submissions whose `team_id` does not
            already exist.
        listener_identity:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            Opaque listener identity reference bound to exactly one team
            and this source system. Globally unique across the
            `source_systems` table; one listener principal maps to
            exactly one `(team_id, source_system_id)` pair. Re-registration
            under the same team or any different team that reuses the
            same `listener_identity` value is rejected without mutation.
        default_image:
          anyOf:
            - $ref: "#/components/schemas/ImageReference"
            - type: "null"

    SourceSystem:
      type: object
      additionalProperties: false
      required:
        [
          source_system_id,
          team_id,
          listener_identity,
          default_image,
          created_at,
          updated_at,
        ]
      properties:
        source_system_id:
          $ref: "#/components/schemas/SourceSystemId"
        team_id:
          $ref: "#/components/schemas/TeamId"
        listener_identity:
          type: string
        default_image:
          anyOf:
            - $ref: "#/components/schemas/ImageReference"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AdminTaskTypeCreateRequest:
      type: object
      additionalProperties: false
      required: [team_id, execution_tag]
      properties:
        team_id:
          $ref: "#/components/schemas/TeamId"
          description: |
            Required reference to an existing immutable `team_id`. The
            Registry rejects submissions whose `team_id` does not
            already exist.
        execution_tag:
          $ref: "#/components/schemas/Tag"
          description: |
            Required execution tag. Tasks of this type declare this
            required tag; Executors must declare the same tag to be
            eligible.
        default_image:
          anyOf:
            - $ref: "#/components/schemas/ImageReference"
            - type: "null"

    TaskType:
      type: object
      additionalProperties: false
      required:
        [
          task_type_id,
          team_id,
          execution_tag,
          default_image,
          created_at,
          updated_at,
        ]
      properties:
        task_type_id:
          $ref: "#/components/schemas/TaskTypeId"
        team_id:
          $ref: "#/components/schemas/TeamId"
        execution_tag:
          $ref: "#/components/schemas/Tag"
        default_image:
          anyOf:
            - $ref: "#/components/schemas/ImageReference"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskState:
      type: string
      enum: [pending, created, running, finished, failed]
      description: |
        `pending` is the projected unclaimed state with no lifecycle
        event; `created` is the first lifecycle state after a successful
        claim; `running`, `finished`, and `failed` follow. The
        `dispatched` state is removed from this revision.

    TaskIngestionRequest:
      type: object
      additionalProperties: false
      required: [team_id, source_system_id, source_id, task_type_id, payload]
      properties:
        team_id:
          $ref: "#/components/schemas/TeamId"
        source_system_id:
          $ref: "#/components/schemas/SourceSystemId"
          description: |
            Immutable `source_system_id` registered by an authenticated
            system administrator through `POST /admin/source-systems`.
            The source system belongs to exactly one team; the listener
            must be authenticated for that team.
        source_id:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            External task identifier within the registered source
            system. Dedupe uses `(team_id, source_system_id, source_id)`.
        task_type_id:
          $ref: "#/components/schemas/TaskTypeId"
          description: |
            REQUIRED reference to a registered task type whose
            immutable `team_id` equals the authenticated listener's
            team. The Registry derives `required_tag` from the
            referenced task type's `execution_tag` and SHALL reject the
            submission when the task type does not exist, does not
            belong to the listener's team, or is otherwise invalid.
            The listener SHALL NOT submit an independently
            authoritative `required_tag`.
        project_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        environment_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        payload:
          $ref: "#/components/schemas/JsonPayload"
        image:
          anyOf:
            - $ref: "#/components/schemas/ImageReference"
            - type: "null"
          description: |
            Optional per-task image override. Opaque to State Registry;
            the registry SHALL NOT resolve, pull, verify, or interpret
            the reference. Once set on the canonical task it is
            immutable for the task's lifetime, so a later listener retry
            of the same `(team_id, source_system_id, source_id)` SHALL
            NOT replace or clear it.

    Task:
      type: object
      additionalProperties: false
      required:
        - task_id
        - team_id
        - source_system_id
        - source_id
        - task_type_id
        - required_tag
        - payload
        - current_state
        - owner_command_id
        - executor_id
        - project_id
        - environment_id
        - image
        - resolved_image
        - image_source
        - ingested_at
        - claimed_at
      properties:
        task_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        source_system_id:
          $ref: "#/components/schemas/SourceSystemId"
        source_id:
          type: string
        task_type_id:
          $ref: "#/components/schemas/TaskTypeId"
          description: |
            REQUIRED non-null reference to a registered task type whose
            immutable `team_id` equals `tasks.team_id`. The Registry
            enforces the composite
            `(tasks.task_type_id, tasks.team_id) = (task_types.task_type_id, task_types.team_id)`
            constraint on every write; a foreign-team `task_type_id`
            is rejected at ingestion time and the row never lands.
        required_tag:
          $ref: "#/components/schemas/Tag"
          description: |
            Server-derived from the referenced `task_type.execution_tag`
            at ingestion. The listener SHALL NOT submit an
            independently authoritative `required_tag`.
        payload:
          $ref: "#/components/schemas/JsonPayload"
        current_state:
          $ref: "#/components/schemas/TaskState"
        owner_command_id:
          anyOf:
            - $ref: "#/components/schemas/CommandId"
            - type: "null"
          description: |
            Immutable `command_id` of the claiming Executor; null
            before claim, set once on successful claim, immutable
            thereafter.
        executor_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
          description: |
            Null before claim, set on successful claim, immutable
            thereafter.
        project_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        environment_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
          description: Reference only; no environment or secret values are embedded.
        image:
          anyOf:
            - $ref: "#/components/schemas/ImageReference"
            - type: "null"
          description: |
            Per-task image override if the listener supplied one at
            ingestion. Immutable for the task's lifetime. Opaque to
            State Registry.
        resolved_image:
          anyOf:
            - $ref: "#/components/schemas/ImageReference"
            - type: "null"
          description: |
            Image resolved at claim from the four-level precedence
            `tasks.image` -> `task_types.default_image` ->
            `source_systems.default_image` -> `teams.default_image`.
            Null while the task is `pending`; non-null and
            immutable from successful claim onward because the team
            default is required at registration. Persisted in the same
            transaction that appends the first `created` event.
        image_source:
          anyOf:
            - $ref: "#/components/schemas/ImageSource"
            - type: "null"
          description: |
            Origin of `resolved_image`. Null while the task is
            `pending`; non-null and immutable from successful claim
            onward; one of `task_override`, `task_type_default`,
            `source_system_default`, or `team_default`.
        ingested_at:
          type: string
          format: date-time
          description: |
            Immutable ingestion instant used as the FIFO primary sort
            key for the same-team / same-tag eligible queue.
        claimed_at:
          anyOf:
            - type: string
            - type: "null"
          format: date-time
          description: Null before claim; set once at successful claim.

    TaskSummary:
      type: object
      additionalProperties: false
      required: [task_id, team_id, required_tag, current_state, ingested_at]
      properties:
        task_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        required_tag:
          $ref: "#/components/schemas/Tag"
        current_state:
          const: pending
        ingested_at:
          type: string
          format: date-time

    PageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, count]
      properties:
        next_cursor:
          type: [string, "null"]
          maxLength: 1536
          description: Opaque cursor derived only from rows in the authenticated team.
        count:
          type: integer
          minimum: 0
          description: Number of rows in this team-filtered page; foreign rows never contribute.

    TaskPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        page:
          $ref: "#/components/schemas/PageInfo"

    TaskDiscoveryPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TaskSummary"
      description: |
        Present only when at least one eligible `pending` match exists;
        otherwise discovery may return `204`. Items are ordered
        `(ingested_at ASC, task_id ASC)` after the eligibility predicate.

    TaskEventType:
      type: string
      enum: [created, running, finished, failed]
      description: |
        The first lifecycle event appended on a successful claim is
        `created`. The contract removes `dispatched`; no event of that
        name exists.

    TaskEvent:
      type: object
      additionalProperties: false
      required:
        [
          event_id,
          team_id,
          task_id,
          executor_id,
          event_type,
          occurred_at,
          payload,
        ]
      properties:
        event_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        task_id:
          $ref: "#/components/schemas/Identifier"
        executor_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
          description: |
            Non-null for the first `created` event on claim (the
            claiming Executor) and for every Executor-emitted event.
        event_type:
          $ref: "#/components/schemas/TaskEventType"
        occurred_at:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/JsonPayload"

    TaskEventAppendRequest:
      type: object
      additionalProperties: false
      required:
        [
          event_id,
          team_id,
          task_id,
          executor_id,
          event_type,
          occurred_at,
          payload,
        ]
      properties:
        event_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        task_id:
          $ref: "#/components/schemas/Identifier"
        executor_id:
          $ref: "#/components/schemas/Identifier"
        event_type:
          type: string
          enum: [running, finished, failed]
        occurred_at:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/JsonPayload"

    EventAcceptance:
      type: object
      additionalProperties: false
      required: [event_id, team_id, accepted_at]
      properties:
        event_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        accepted_at:
          type: string
          format: date-time

    TaskEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TaskEvent"
        page:
          $ref: "#/components/schemas/PageInfo"

    ExecutorScope:
      type: string
      enum: [team, system]
      description: |
        Registration-time ownership scope of an Executor. `team` means
        the Executor is bound to exactly one immutable `team_id` that
        references an existing team; discovery, claim, and task-event
        envelope verification require same-team ownership. `system`
        means the Executor has no team binding; discovery, claim, and
        task-event envelope verification match the Executor's single
        registered tag across every team, and the task-event envelope
        `team_id` is verified against the parent task's `team_id`
        rather than against an Executor's immutable service binding
        (which is null). The scope is immutable from registration
        onward; re-registration that names a different scope is
        rejected without mutation. Executor registration never creates
        or updates a team.

    ExecutorRegistrationRequest:
      type: object
      additionalProperties: false
      required:
        [
          scope,
          executor_type,
          authorized_tag,
          max_capacity,
          running_count,
          runtime_metadata,
        ]
      properties:
        scope:
          $ref: "#/components/schemas/ExecutorScope"
        team_id:
          $ref: "#/components/schemas/TeamId"
          description: |
            Conditionally required when `scope = team` and SHALL equal an
            existing immutable `team_id`; must be absent when `scope = system`.
            State Registry SHALL verify the submitted `team_id` matches
            the authenticated Executor service identity when `scope =
            team`, SHALL reject a submission whose `team_id` does not
            reference an existing team, SHALL persist the value on the
            Executor row when `scope = team`, and SHALL persist NULL when
            `scope = system`. Submitting the property with `scope = system`,
            including explicit null, is rejected without persistence.
        executor_type:
          type: string
          minLength: 1
          maxLength: 128
        authorized_tag:
          $ref: "#/components/schemas/Tag"
        max_capacity:
          type: integer
          minimum: 0
          description: Informational observation only.
        running_count:
          type: integer
          minimum: 0
          description: Informational observation only.
        runtime_metadata:
          type: object
          additionalProperties: true

    Executor:
      type: object
      additionalProperties: false
      required:
        - executor_id
        - scope
        - team_id
        - executor_type
        - identity
        - authorized_tag
        - max_capacity
        - running_count
        - runtime_metadata
        - registered_at
        - updated_at
      properties:
        executor_id:
          $ref: "#/components/schemas/Identifier"
        scope:
          $ref: "#/components/schemas/ExecutorScope"
        team_id:
          anyOf:
            - $ref: "#/components/schemas/TeamId"
            - type: "null"
          description: |
            Immutable when `scope = team`; NULL when `scope = system`.
        executor_type:
          type: string
        identity:
          type: string
        authorized_tag:
          $ref: "#/components/schemas/Tag"
        max_capacity:
          type: integer
          minimum: 0
          description: Latest observation; never a Registry scheduling gate.
        running_count:
          type: integer
          minimum: 0
          description: Latest observation; never a Registry scheduling gate.
        runtime_metadata:
          type: object
          additionalProperties: true
        registered_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ExecutorPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Executor"
        page:
          $ref: "#/components/schemas/PageInfo"

    ExecutorEventType:
      type: string
      enum:
        - registered
        - started
        - healthy
        - busy
        - idle
        - stopping
        - stopped
        - failed
        - capacity_observed
        - running_count_observed

    ExecutorEventAppendRequest:
      type: object
      additionalProperties: false
      required:
        [
          event_id,
          team_id,
          task_id,
          executor_id,
          event_type,
          occurred_at,
          payload,
        ]
      properties:
        event_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          anyOf:
            - $ref: "#/components/schemas/TeamId"
            - type: "null"
          description: |
            Required for a team-owned Executor and SHALL equal the
            Executor's immutable `team_id`. Required to be null for a
            system-owned Executor; supplying a non-null value for a
            system-owned Executor is rejected with `403 team_mismatch`.
        task_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        executor_id:
          $ref: "#/components/schemas/Identifier"
        event_type:
          $ref: "#/components/schemas/ExecutorEventType"
        occurred_at:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/JsonPayload"

    ExecutorEvent:
      type: object
      additionalProperties: false
      required:
        [
          event_id,
          team_id,
          task_id,
          executor_id,
          event_type,
          occurred_at,
          payload,
        ]
      properties:
        event_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          anyOf:
            - $ref: "#/components/schemas/TeamId"
            - type: "null"
          description: |
            `team_id` is non-null for every row inherited from a
            team-owned Executor and equals the Executor's immutable
            `team_id`. `team_id` is NULL for every row inherited from a
            system-owned Executor.
        task_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        executor_id:
          $ref: "#/components/schemas/Identifier"
        event_type:
          $ref: "#/components/schemas/ExecutorEventType"
        occurred_at:
          type: string
          format: date-time
        payload:
          $ref: "#/components/schemas/JsonPayload"

    ExecutorEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExecutorEvent"
        page:
          $ref: "#/components/schemas/PageInfo"

    ClaimRequest:
      type: object
      additionalProperties: false
      required: [task_id, command_id]
      properties:
        task_id:
          $ref: "#/components/schemas/Identifier"
        command_id:
          $ref: "#/components/schemas/CommandId"

    ClaimResponse:
      type: object
      additionalProperties: false
      required:
        [
          claim,
          task,
          environment_id,
          scope_token,
          resolved_image,
          image_source,
          claimed_at,
        ]
      properties:
        claim:
          const: claimed
        task:
          $ref: "#/components/schemas/Task"
        environment_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        scope_token:
          anyOf:
            - $ref: "#/components/schemas/CompactScopeToken"
            - type: "null"
          description: |
            Compact scope token (single string of the form
            `<header>.<payload>.<signature>`) issued by State Registry
            and signed with an allow-listed HMAC algorithm
            (`HS256`/`HS384`/`HS512`) under a server-controlled
            rotating key. The Executor must carry it in the
            `X-FlowAI-Scope-Token` header of
            `GET /v1/environments/{environment_id}/open`. Present only
            when the claimed task references an applicable environment.
            Treat as confidential and never log it.
        resolved_image:
          $ref: "#/components/schemas/ImageReference"
          description: |
            Authoritative image resolved at claim from `tasks.image` ->
            `task_types.default_image` -> `source_systems.default_image`
            -> `teams.default_image` (always present because the team
            default is required at registration). Present and
            non-empty on every successful claim.
        image_source:
          $ref: "#/components/schemas/ImageSource"
        claimed_at:
          type: string
          format: date-time

    ScopeTokenAlgorithm:
      type: string
      enum: [HS256, HS384, HS512]
      description: |
        Allow-listed HMAC algorithm for the open-environment scope
        token. The contract accepts only `HS256`, `HS384`, or `HS512` —
        the "HMAC-SHA-256 or a stronger HMAC" family. Any other value,
        including asymmetric algorithms and non-allow-listed HMAC
        variants, is rejected by the same non-revealing `404
        environment_unknown_or_unavailable` response as every other
        invalid case. The Registry recomputes the signature using
        exactly the algorithm declared by the protected header.

    ScopeTokenType:
      type: string
      const: scope-token+json
      description: Required token media type; any other value is rejected.

    ScopeTokenHeader:
      type: object
      additionalProperties: false
      required: [alg, kid, typ]
      properties:
        alg:
          $ref: "#/components/schemas/ScopeTokenAlgorithm"
        kid:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
          description: Active signing-key identifier used by the server-side key handle; never returned to callers in plan or logs.
        typ:
          $ref: "#/components/schemas/ScopeTokenType"

    ScopeTokenAudience:
      type: string
      const: state-registry.environment.open

    ScopeTokenClaims:
      type: object
      additionalProperties: false
      required:
        [
          team_id,
          project_id,
          task_id,
          environment_id,
          executor_id,
          audience,
          key_id,
          issued_at,
          expiry,
        ]
      properties:
        team_id:
          $ref: "#/components/schemas/TeamId"
        project_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
          description: |
            Required claim. The value is nullable only when the
            canonical environment has no project scope; a missing
            `project_id` claim is rejected as malformed, and a null
            value for a project-scoped environment or any non-null
            mismatch with canonical records is rejected as invalid.
        task_id:
          $ref: "#/components/schemas/Identifier"
        environment_id:
          $ref: "#/components/schemas/Identifier"
        executor_id:
          $ref: "#/components/schemas/Identifier"
        audience:
          $ref: "#/components/schemas/ScopeTokenAudience"
        key_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
          description: |
            Active signing-key identifier carried in the payload. The
            Registry verifies that this value equals the
            protected-header `kid` before recomputing the MAC; a
            mismatch is rejected by the same non-revealing `404
            environment_unknown_or_unavailable` response before any
            other check and before any decrypt operation.
        issued_at:
          type: string
          format: date-time
          description: |
            Server-side issuance instant. `issued_at` MUST satisfy
            `issued_at <= server_now + 30s` (tolerated clock-skew
            window of 30 seconds) and `expiry` MUST be strictly later
            than `issued_at`.
        expiry:
          type: string
          format: date-time
          description: |
            Absolute expiry instant. The Registry rejects any token
            whose lifetime exceeds five minutes (`expiry - issued_at <=
            5 minutes`), whose `expiry` is not strictly later than
            `issued_at`, or whose `issued_at` is premature beyond 30
            seconds of clock skew. Token refresh requires a new
            successful claim rather than a new token over the same
            task.

    CompactScopeToken:
      type: string
      minLength: 32
      maxLength: 8192
      pattern: '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
      description: |
        Compact three-part scope token
        `<header>.<payload>.<signature>` carried in the
        `X-FlowAI-Scope-Token` header. The header segment must decode
        to `ScopeTokenHeader` (`alg` allow-listed to
        `HS256`/`HS384`/`HS512`, `kid`, `typ = scope-token+json`) and
        the payload segment must decode to `ScopeTokenClaims` with
        every bound claim (`team_id`, `project_id`, `task_id`,
        `environment_id`, `executor_id`, `audience =
        state-registry.environment.open`, `key_id`, `issued_at`,
        `expiry`) and `issued_at <= server_now + 30s`, `expiry >
        issued_at`, `expiry - issued_at <= 5 minutes`. The Registry
        first verifies that the protected-header `kid` equals the
        payload `key_id`; any mismatch is rejected before MAC
        recomputation and before any decrypt operation. The
        `<signature>` segment is then recomputed under the declared
        allow-listed HMAC algorithm and the server-side key handle
        identified by `key_id`; it is compared with constant-time
        equality before any decrypt operation. Treat the value as
        confidential and never log it.

    ControlAction:
      type: string
      enum: [cancel, interrupt]

    ControlStatus:
      type: string
      enum: [pending, acknowledged, completed, failed]

    ControlCreateRequest:
      type: object
      additionalProperties: false
      required: [action, idempotency_key]
      properties:
        action:
          $ref: "#/components/schemas/ControlAction"
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
        reason:
          type: string
          maxLength: 500
          description: Non-sensitive operator rationale; must not contain secrets or decrypted values.

    Control:
      type: object
      additionalProperties: false
      required:
        [
          control_id,
          team_id,
          task_id,
          operator_id,
          action,
          idempotency_key,
          status,
          audit_id,
          requested_at,
        ]
      properties:
        control_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        task_id:
          $ref: "#/components/schemas/Identifier"
        operator_id:
          $ref: "#/components/schemas/Identifier"
        action:
          $ref: "#/components/schemas/ControlAction"
        idempotency_key:
          type: string
        status:
          $ref: "#/components/schemas/ControlStatus"
        audit_id:
          $ref: "#/components/schemas/Identifier"
        requested_at:
          type: string
          format: date-time

    ControlPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Control"

    EnvironmentScope:
      type: object
      additionalProperties: false
      required: [project_id, task_id, parent_task_id]
      properties:
        project_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        task_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        parent_task_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
          description: |
            Optional parent `task_id` for task-owned environment
            definitions and the secrets under them. When set, the row
            is task-owned: its `team_id` is immutable, the parent
            `task_id` SHALL reference a task with the same `team_id`,
            and only the parent task in the same team may use the
            definition. When null, the row is team-wide. Setting
            `parent_task_id` to a foreign-team `task_id` returns the
            same non-revealing `404 environment_unknown_or_unavailable`
            shape and performs no decrypt operation.
      description: Applicability inside the owning team only; this is not RBAC and never grants cross-team access.

    NonSecretValues:
      type: object
      propertyNames:
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
      additionalProperties:
        type: string
        maxLength: 65536
      description: Explicitly non-secret environment values. Secret values use the logical-secret endpoints.

    EnvironmentWriteRequest:
      type: object
      additionalProperties: false
      required: [name, scope, values]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scope:
          $ref: "#/components/schemas/EnvironmentScope"
        values:
          $ref: "#/components/schemas/NonSecretValues"

    Environment:
      type: object
      additionalProperties: false
      required:
        [
          environment_id,
          team_id,
          revision,
          name,
          scope,
          values,
          secrets,
          deleted,
          created_at,
          updated_at,
        ]
      properties:
        environment_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        revision:
          type: integer
          minimum: 1
        name:
          type: string
        scope:
          $ref: "#/components/schemas/EnvironmentScope"
        values:
          $ref: "#/components/schemas/NonSecretValues"
        secrets:
          type: array
          description: Logical references and non-sensitive metadata only.
          items:
            $ref: "#/components/schemas/LogicalSecretSummary"
        deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    EnvironmentPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Environment"
        page:
          $ref: "#/components/schemas/PageInfo"

    SecretCreateRequest:
      type: object
      additionalProperties: false
      required: [name, value, scope]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        value:
          type: string
          minLength: 1
          maxLength: 1048576
          writeOnly: true
          description: |
            Plaintext accepted only for immediate local AES-256-GCM
            authenticated encryption; never persisted, logged,
            audited, or returned in plaintext.
        scope:
          $ref: "#/components/schemas/EnvironmentScope"

    SecretReplaceRequest:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 1048576
          writeOnly: true
          description: |
            Replacement plaintext accepted only for immediate local
            AES-256-GCM authenticated encryption.

    LogicalSecretSummary:
      type: object
      additionalProperties: false
      required:
        [secret_id, team_id, environment_id, name, latest_version, revoked]
      properties:
        secret_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        environment_id:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
        latest_version:
          type: integer
          minimum: 1
        revoked:
          type: boolean

    LogicalSecret:
      type: object
      additionalProperties: false
      required:
        [
          secret_id,
          team_id,
          environment_id,
          name,
          scope,
          latest_version,
          revoked,
          created_at,
          updated_at,
        ]
      properties:
        secret_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        environment_id:
          $ref: "#/components/schemas/Identifier"
        name:
          type: string
        scope:
          $ref: "#/components/schemas/EnvironmentScope"
        latest_version:
          type: integer
          minimum: 1
        revoked:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      description: |
        Logical secret metadata only; no plaintext, ciphertext,
        nonce, tag, or decryption material.

    SecretVersion:
      type: object
      additionalProperties: false
      required: [secret_id, team_id, version, key_id, key_version, created_at]
      properties:
        secret_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        version:
          type: integer
          minimum: 1
        key_id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]*$"
          description: |
            Opaque provider-neutral key identifier of the AES-256-GCM
            data key used to encrypt this version. The opaque value
            allows a future change to swap the cryptographic provider
            without changing this contract surface.
        key_version:
          type: integer
          minimum: 1
          description: |
            Opaque provider-neutral key version of the AES-256-GCM
            data key used to encrypt this version. The opaque value
            allows a future change to swap the cryptographic provider
            without changing this contract surface.
        created_at:
          type: string
          format: date-time
      description: |
        Immutable metadata for an encrypted version; never contains
        plaintext, ciphertext, nonce, tag, or associated-data values.

    SecretWriteResponse:
      type: object
      additionalProperties: false
      required: [secret, version]
      properties:
        secret:
          $ref: "#/components/schemas/LogicalSecret"
        version:
          $ref: "#/components/schemas/SecretVersion"

    LogicalSecretPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LogicalSecret"
        page:
          $ref: "#/components/schemas/PageInfo"

    SecretVersionPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecretVersion"
        page:
          $ref: "#/components/schemas/PageInfo"

    OpenEnvironmentResponse:
      type: object
      additionalProperties: false
      required:
        [team_id, project_id, task_id, environment_id, executor_id, values]
      properties:
        team_id:
          $ref: "#/components/schemas/TeamId"
        project_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        task_id:
          $ref: "#/components/schemas/Identifier"
        environment_id:
          $ref: "#/components/schemas/Identifier"
        executor_id:
          $ref: "#/components/schemas/Identifier"
        values:
          type: object
          propertyNames:
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          additionalProperties:
            type: string
          description: |
            Env-style values, including authorized decrypted secrets,
            returned only to the assigned Executor after a successful
            AES-256-GCM authenticated decryption. The application
            receives plaintext in memory only.

    AuditActorType:
      type: string
      enum: [operator, executor, listener, system_administrator, state_registry]

    AuditOutcome:
      type: string
      enum: [accepted, rejected, succeeded, failed]

    AuditEntry:
      type: object
      additionalProperties: false
      required:
        [
          audit_id,
          team_id,
          actor_id,
          actor_type,
          action,
          resource_type,
          resource_id,
          request_id,
          outcome,
          occurred_at,
        ]
      properties:
        audit_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        actor_id:
          $ref: "#/components/schemas/Identifier"
        actor_type:
          $ref: "#/components/schemas/AuditActorType"
        action:
          type: string
          minLength: 1
          maxLength: 128
        resource_type:
          type: string
          minLength: 1
          maxLength: 64
        resource_id:
          $ref: "#/components/schemas/Identifier"
        request_id:
          type: string
          minLength: 1
          maxLength: 128
        outcome:
          $ref: "#/components/schemas/AuditOutcome"
        occurred_at:
          type: string
          format: date-time
      description: |
        Plaintext-free immutable audit record; no secret, nonce,
        ciphertext, tag, key material, or decrypted value is permitted.

    AuditPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditEntry"
        page:
          $ref: "#/components/schemas/PageInfo"

    StreamEventKind:
      type: string
      enum: [task_event, executor_event, control, audit]

    WebSocketEventFrame:
      type: object
      additionalProperties: false
      required:
        [
          cursor,
          team_id,
          event_kind,
          resource_type,
          resource_id,
          occurred_at,
          payload,
        ]
      properties:
        cursor:
          type: string
          minLength: 1
          maxLength: 512
          description: Opaque cursor scoped to the bound WebSocket team.
        team_id:
          $ref: "#/components/schemas/TeamId"
        event_kind:
          $ref: "#/components/schemas/StreamEventKind"
        resource_type:
          type: string
          enum: [task, executor, control, audit]
        resource_id:
          $ref: "#/components/schemas/Identifier"
        occurred_at:
          type: string
          format: date-time
        payload:
          oneOf:
            - $ref: "#/components/schemas/TaskEvent"
            - $ref: "#/components/schemas/ExecutorEvent"
            - $ref: "#/components/schemas/Control"
            - $ref: "#/components/schemas/AuditEntry"
      description: Every frame's `team_id` must equal the immutable Gateway team bound at upgrade.

    AdminTagEntry:
      type: object
      additionalProperties: false
      required: [team_id, task_type_id, execution_tag]
      properties:
        team_id:
          $ref: "#/components/schemas/TeamId"
        task_type_id:
          $ref: "#/components/schemas/TaskTypeId"
        execution_tag:
          $ref: "#/components/schemas/Tag"
      description: |
        Exact allowlist projection of a registered task type for `GET
        /admin/tags`. Each entry contains EXACTLY three fields:
        `team_id`, `task_type_id`, and `execution_tag`. The Registry
        SHALL NOT add, omit, rename, or re-order these fields; SHALL
        NOT include `default_image`; and SHALL NOT include any other
        column from any table. Image strings are not team-owned
        resources and equal `execution_tag` values across teams grant
        no cross-team authority.

    AdminTagPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminTagEntry"
        page:
          $ref: "#/components/schemas/AdminPageInfo"
      description: |
        Tag page ordered by `(team_id ASC, execution_tag ASC,
        task_type_id ASC)`. The page MAY be empty.

    AdminTaskEntry:
      type: object
      additionalProperties: false
      required:
        - task_id
        - team_id
        - task_type_id
        - source_system_id
        - source_id
        - required_tag
        - current_state
        - owner_command_id
        - executor_id
        - ingested_at
        - claimed_at
      properties:
        task_id:
          $ref: "#/components/schemas/Identifier"
        team_id:
          $ref: "#/components/schemas/TeamId"
        task_type_id:
          $ref: "#/components/schemas/TaskTypeId"
        source_system_id:
          $ref: "#/components/schemas/SourceSystemId"
        source_id:
          type: string
          minLength: 1
          maxLength: 256
        required_tag:
          $ref: "#/components/schemas/Tag"
        current_state:
          $ref: "#/components/schemas/TaskState"
        owner_command_id:
          anyOf:
            - $ref: "#/components/schemas/CommandId"
            - type: "null"
        executor_id:
          anyOf:
            - $ref: "#/components/schemas/Identifier"
            - type: "null"
        ingested_at:
          type: string
          format: date-time
        claimed_at:
          anyOf:
            - type: string
            - type: "null"
          format: date-time
      description: |
        Exact allowlist read-only task summary for `GET /admin/tasks`.
        Each entry contains EXACTLY eleven fields: `task_id`,
        `team_id`, `task_type_id`, `source_system_id`, `source_id`,
        `required_tag`, `current_state`, `owner_command_id`,
        `executor_id`, `ingested_at`, and `claimed_at`. The Registry
        SHALL NOT add, omit, rename, or re-order these fields; SHALL
        NOT include `image`, `resolved_image`, `image_source`,
        `project_id`, `environment_id`, or task payload values; and
        SHALL NOT include any other column from any table. This admin
        projection does NOT change the canonical `Task` resource
        returned by claim, by same-team Gateway reads, by same-team
        Executor discovery, or by any other non-admin endpoint. Equal
        `required_tag` strings across teams SHALL NOT grant
        cross-team authority. Every canonical task has a non-null
        `task_type_id` because listener ingestion now requires it;
        `required_tag` is always derived from that task type. Pending
        unclaimed tasks report null `owner_command_id`, `executor_id`,
        and `claimed_at`; all other required fields remain stable
        across the task lifetime.

    AdminTaskPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminTaskEntry"
        page:
          $ref: "#/components/schemas/AdminPageInfo"
      description: |
        Task page ordered by `(ingested_at DESC, task_id DESC)`. The
        page MAY be empty; the response SHALL always be paginated and
        SHALL NOT be unbounded.

    AdminPageInfo:
      type: object
      additionalProperties: false
      required: [next_cursor, count]
      properties:
        next_cursor:
          type: [string, "null"]
          maxLength: 1536
          description: |
            Opaque cursor derived only from rows in the global
            `/admin/tags` or `/admin/tasks` collection visible to the
            authenticated system-administrator identity. When null,
            the page is the final page.
        count:
          type: integer
          minimum: 0
          description: Number of rows in this page.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9_]*$"
        message:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable non-sensitive summary only; no database, stack, tenant, secret, nonce, ciphertext, tag, key material, or decrypted-value detail.
        request_id:
          type: string
          minLength: 1
          maxLength: 128
      description: Closed error envelope. Free-form details and sensitive context are forbidden.
