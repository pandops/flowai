openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

info:
  title: FlowAI State Registry API
  version: v0002-proposed
  summary: Normative tenant-aware contract for the v0002 State Registry.
  description: |
    The State Registry is the durable source of truth for team-owned tasks,
    Executors, assignments, immutable events, controls, environments, logical
    secrets, immutable encrypted secret versions, and audit entries.

    Every caller is authenticated with mutually authenticated TLS. Listener
    identities are bound to exactly one immutable team and one immutable
    source system. Executor identities register `scope = team` (bound to
    exactly one immutable team_id referencing an existing team) OR
    `scope = system` (no team binding; cross-team dispatch by tag). No
    Executor identity is implicitly team-bound; the team-predicate is
    conditional on `scope`. `team_name` is display and audit context only
    and never authorizes. `image` strings are not team-owned resources and
    image equality carries no authority. Operator operations are accepted
    only from the trusted API Gateway service identity together with the
    internal context headers defined by this contract. `X-FlowAI-Team-ID`
    is the sole tenant authority and is required on every Gateway-mediated
    request. `X-FlowAI-Team-Name` is optional display and audit context;
    when present it is never trusted to grant, select, or broaden access,
    and when absent the Registry still authorizes solely by
    `X-FlowAI-Team-ID`. Admin operations for team, source-system, and
    task-type creation (`POST /admin/teams`, `POST /admin/source-systems`,
    `POST /admin/task-types`) require an authenticated mutual-TLS
    transport identity that the deployment has authorized as a system
    administrator. The rule that maps an authenticated transport
    identity to the system-administrator role is deployment-defined and
    outside this contract; the contract does not define a
    caller-supplied admin header, token shape, certificate subject,
    claim, or role mapping. `/admin/*` is never reachable through a
    listener, Executor, or Gateway transport identity; only a
    system-administrator-authorized mTLS identity may reach it. The
    team resource is create-only: there is no `PUT`, `PATCH`, or
    `DELETE` team endpoint. Read-only system-admin-only projections
    are also exposed through `/admin/*`: `GET /admin/tags` returns a
    global projection of canonical task types and `GET /admin/tasks`
    returns a global read-only task-summary projection. Both reads are
    rejected before any row is read or returned when the authenticated
    identity is not a system administrator; neither endpoint mutates
    any team, source system, task type, task, assignment, event,
    environment, secret, control, or audit row; neither endpoint
    returns payload values, decrypted environment values, secret
    material, or event history; neither endpoint grants authority from
    cross-team tag equality; there is no `tags` table, no tag
    create/update/delete API, and no system-admin
    authentication-mechanism definition. Listener ingestion
    (`POST /v1/tasks`) is task-type-driven: `task_type_id` is REQUIRED
    and `required_tag` is derived server-side from the referenced task
    type's `execution_tag`; the listener SHALL NOT submit an
    independently authoritative `required_tag`.

    All point lookups treat a resource owned by another team exactly like an
    unknown identifier and return the same closed `ErrorResponse` shape. All
    collection filters, pagination, totals, cursors, aggregations, WebSocket
    replay, and live fan-out are applied after the authenticated team predicate.
    A foreign-only collection is therefore empty (or `204` where explicitly
    defined), with no metadata that reveals foreign rows.

    At-rest secret values are protected with local AES-256-GCM authenticated
    encryption (256-bit data key, fresh random 96-bit nonce per encryption,
    128-bit authentication tag, authenticated associated data binding team
    identifier, logical secret identifier, and version) keyed by an opaque
    provider-neutral `key_id` / `key_version` pair recorded on every
    `secret_versions` row. Plaintext, nonce bytes, ciphertext bytes,
    authentication tag bytes, key material, and individual associated-data
    values beyond identifier-level metadata SHALL NEVER appear in application
    logs, audit records, or error responses. The Registry fails closed at
    startup when the data key is missing.
  license:
    name: Internal planning artifact
    identifier: LicenseRef-Internal-Planning

servers:
  - url: https://state-registry.internal
    description: Plaintext HTTP internal service endpoint (external HTTPS terminates at Ingress)

security: []

tags:
  - name: Admin
  - name: Listener tasks
  - name: Executor identity
  - name: Executor discovery
  - name: Executor events
  - name: Gateway reads
  - name: Controls
  - name: Environments
  - name: Secrets
  - name: Audit
  - name: Subscriptions
  - name: Teams

paths:
  /admin/teams:
    post:
      tags: [Admin]
      summary: Create a team (admin-only)
      operationId: adminCreateTeam
      description: |
        Accepted only from an authenticated system-administrator identity. The
        request body must include a unique `team_name` (display-only) and a
        required opaque `default_image`. The Registry generates an
        immutable `team_id`, persists it along with `team_name` and the
        required `default_image`, and returns the canonical team record.
        No listener, Executor, or Gateway path may create or update a team.
        The team resource is create-only: there is no `PUT`, `PATCH`, or
        `DELETE` team endpoint, and no path may alter `team_name`,
        `default_image`, or any other team field after creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTeamCreateRequest"
      responses:
        "201":
          description: Canonical team record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"

  /admin/source-systems:
    post:
      tags: [Admin]
      summary: Register a team-owned source system (admin-only)
      operationId: adminCreateSourceSystem
      description: |
        Accepted only from an authenticated system-administrator identity.
        The body requires a `team_id` that references an existing team and a
        listener identity reference; the Registry persists an immutable
        `source_system_id` and the optional `default_image`. A
        source-system identity belongs to exactly one team and cannot be
        reattached to another team. The opaque `listener_identity`
        reference is constrained by a database-enforced global uniqueness
        index so one listener principal maps to exactly one
        `(team_id, source_system_id)` pair; a second registration under the
        same team, a different team, or any other variation that reuses
        the same `listener_identity` value SHALL be rejected without
        persistence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSourceSystemCreateRequest"
      responses:
        "201":
          description: Canonical source system record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSystem"
        "400":
          description: |
            Validation failure including an unknown `team_id`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "409":
          description: |
            The `listener_identity` is already bound to an existing
            `(team_id, source_system_id)` row. The global uniqueness
            conflict creates no partial source-system row.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/task-types:
    post:
      tags: [Admin]
      summary: Register a team-owned task type (admin-only)
      operationId: adminCreateTaskType
      description: |
        Accepted only from an authenticated system-administrator identity.
        The body requires a `team_id` that references an existing team and a
        required `execution_tag`; the Registry persists an immutable
        `task_type_id` and the optional `default_image`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTaskTypeCreateRequest"
      responses:
        "201":
          description: Canonical task type record created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskType"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"

  /admin/tags:
    get:
      tags: [Admin]
      summary: List canonical task-configuration-derived tags (admin-only)
      operationId: adminListTags
      description: |
        Accepted only from an authenticated system-administrator identity.
        Returns a global read-only projection of every registered
        `task_types` row. The Registry rejects every other identity before
        reading any row. Each entry contains EXACTLY `team_id`,
        `task_type_id`, and `execution_tag` (no `default_image`, no
        other columns). Entries are ordered deterministically by
        `(team_id ASC, execution_tag ASC, task_type_id ASC)`. Cursor
        pagination defaults to 50 entries per page and caps at 200; an
        out-of-range or malformed `limit` is rejected before any row is
        read. Optional exact-match `team_id` and `tag` filters narrow
        the global collection. The endpoint never creates, updates,
        deletes, or mutates any team, source system, task type, task,
        assignment, event, environment, secret, control, or audit row;
        never returns task payload values, decrypted environment values,
        secret material, nonce bytes, ciphertext bytes, authentication
        tag bytes, key material, or event history; and never grants,
        broadens, selects, or weakens any tenant authorization. Equal
        `execution_tag` strings appearing under different `team_id`s
        SHALL NOT grant cross-team authority.
      parameters:
        - $ref: "#/components/parameters/AdminTagTeamIdFilter"
        - $ref: "#/components/parameters/AdminTagTagFilter"
        - $ref: "#/components/parameters/AdminCursor"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: |
            Tag page ordered by `(team_id ASC, execution_tag ASC,
            task_type_id ASC)`. The page MAY be empty when no canonical
            task type matches the filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTagPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"

  /admin/tasks:
    get:
      tags: [Admin]
      summary: List canonical task summaries across teams (admin-only)
      operationId: adminListTasks
      description: |
        Accepted only from an authenticated system-administrator identity.
        Returns a global read-only projection of canonical task
        summaries across every team. The Registry rejects every other
        identity before reading any row. Each entry contains EXACTLY
        `task_id`, `team_id`, `task_type_id`, `source_system_id`,
        `source_id`, `required_tag`, `current_state`, `owner_command_id`,
        `executor_id`, `ingested_at`, and `claimed_at` (no `image`, no
        `resolved_image`, no `image_source`, no `project_id`, no
        `environment_id`, no task payload). Entries are ordered
        deterministically by `(ingested_at DESC, task_id DESC)`. Cursor
        pagination defaults to 50 entries per page and caps at 200; an
        out-of-range or malformed `limit` is rejected before any row is
        read. Optional exact-match `team_id`, `state`, `tag`, and
        `task_type_id` filters narrow the global collection. "All" tasks
        means a traversable, paginated global collection; the response
        SHALL NOT be unbounded. The endpoint never creates, updates,
        deletes, or mutates any team, source system, task type, task,
        assignment, event, environment, secret, secret version, control,
        or audit row; never returns task payload values, decrypted
        environment values, secret material, nonce bytes, ciphertext
        bytes, authentication tag bytes, key material, or event
        history; and never grants, broadens, selects, or weakens any
        tenant authorization. Equal `required_tag` strings appearing
        under different `team_id`s SHALL NOT grant cross-team
        authority.
      parameters:
        - $ref: "#/components/parameters/AdminTaskTeamIdFilter"
        - $ref: "#/components/parameters/AdminTaskStateFilter"
        - $ref: "#/components/parameters/AdminTaskTagFilter"
        - $ref: "#/components/parameters/AdminTaskTypeIdFilter"
        - $ref: "#/components/parameters/AdminCursor"
        - $ref: "#/components/parameters/AdminLimit"
      responses:
        "200":
          description: |
            Task page ordered by `(ingested_at DESC, task_id DESC)`. The
            page MAY be empty when no canonical task matches the
            filters.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTaskPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"

  /v1/tasks:
    post:
      tags: [Listener tasks]
      summary: Persist or deduplicate a listener task
      operationId: ingestTask
      description: |
        The authenticated listener identity is bound to one team and one
        source system. The body `team_id` must equal that team binding,
        `source_system_id` must equal that source-system binding, and
        the body SHALL carry a REQUIRED `task_type_id` referencing a
        registered task type whose immutable `team_id` equals the
        authenticated listener's team. The Registry enforces a database
        composite
        `(tasks.task_type_id, tasks.team_id) = (task_types.task_type_id, task_types.team_id)`
        constraint on every write; a missing or foreign-team
        `task_type_id` is rejected without persistence, without event
        append, and without listener acknowledgement. The Registry
        derives `required_tag` from the referenced task type's
        `execution_tag` and SHALL NOT accept an independently
        authoritative `required_tag` from the listener. A new `pending`
        task row with no lifecycle event is committed in one transaction
        before `201` is returned; `ingested_at` is set once and is
        immutable. A retry of `(team_id, source_system_id, source_id)`
        returns the existing canonical task with `200` and appends no
        event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskIngestionRequest"
      responses:
        "201":
          description: New canonical `pending` task committed with no event.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "200":
          description: Existing canonical task returned for an idempotent team-scoped retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    get:
      tags: [Gateway reads]
      summary: List tasks in the operator team
      operationId: listTasks
      description: |
        Team filtering occurs before every filter, total, cursor, and page is
        computed. Foreign rows cannot affect an empty result, count, or cursor.
        Entries are deterministically ordered `(ingested_at DESC, task_id DESC)`
        after the trusted `team_id` predicate and before pagination. Each
        `next_cursor` is opaque, integrity-protected, and bound to this
        endpoint, the trusted Gateway `team_id` plus verified `operator_id`,
        every supplied filter, the `(ingested_at DESC, task_id DESC)`
        ordering, and the forward page direction; the Registry rejects
        tampered, cross-endpoint, cross-scope, or changed-filter cursors
        with the same non-revealing `400 invalid_pagination` shape before
        any protected query runs.
      parameters:
        - $ref: "#/components/parameters/GatewayOperatorId"
        - $ref: "#/components/parameters/GatewayTeamId"
        - $ref: "#/components/parameters/GatewayTeamName"
        - $ref: "#/components/parameters/GatewayRequestId"
        - $ref: "#/components/parameters/TaskStateFilter"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Team-filtered task page, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"

  /v1/tasks/{task_id}:
    get:
      tags: [Gateway reads]
      summary: Read a canonical task
      operationId: getTask
      description: A foreign-team task identifier returns the same `404 task_unknown` response as an unknown identifier.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/GatewayOperatorId"
        - $ref: "#/components/parameters/GatewayTeamId"
        - $ref: "#/components/parameters/GatewayTeamName"
        - $ref: "#/components/parameters/GatewayRequestId"
      responses:
        "200":
          description: Team-owned canonical task without plaintext secret values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/TaskNotFound"

  /v1/tasks/{task_id}/events:
    post:
      tags: [Executor events]
      summary: Append an assigned-Executor lifecycle event
      operationId: appendTaskEvent
      description: |
        Accepts `running`, `finished`, or `failed` from the authenticated
        Executor currently assigned to the task. The complete envelope
        includes `team_id`. An identical `(task_id, event_id)` retry returns
        the original `202` result. New events must follow the lifecycle and
        have an `(occurred_at, event_id)` tuple strictly greater than the
        latest accepted tuple. `accepted_sequence` and other recovery
        overrides are not accepted.
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskEventAppendRequest"
      responses:
        "202":
          description: Event accepted, or original acceptance returned for an identical retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The authenticated Executor is on the same team but is not the
            assigned Executor (`not_assigned`) or its envelope `team_id`
            does not match its immutable service binding (`team_mismatch`).
            No event is appended and no projection changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          $ref: "#/components/responses/InvalidTaskTransition"
    get:
      tags: [Gateway reads]
      summary: Read ordered task event history
      operationId: listTaskEvents
      description: |
        Returns only events inherited from the trusted Gateway team, ordered
        by `(occurred_at ASC, event_id ASC)`. Team filtering is applied
        before the cursor and page are computed. The first lifecycle event on
        any claimed task is `created` and carries a non-null `executor_id`
        that identifies the claiming Executor; Executor-emitted events have
        non-null `executor_id` and required `team_id`.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/GatewayOperatorId"
        - $ref: "#/components/parameters/GatewayTeamId"
        - $ref: "#/components/parameters/GatewayTeamName"
        - $ref: "#/components/parameters/GatewayRequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Deterministically ordered, team-filtered event page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskEventPage"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/TaskNotFound"

  /v1/executors:
    post:
      tags: [Executor identity]
      summary: Register a new Executor and assign its immutable identifier
      operationId: createExecutorRegistration
      description: |
        First-start registration. State Registry validates the authenticated
        mTLS identity and request body, generates an immutable UUID
        `executor_id`, persists the canonical Executor, and returns it. The
        request body carries neither `executor_id` nor `identity`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutorRegistrationRequest"
      responses:
        "201":
          description: Canonical Executor created with server-generated executor_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Executor"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
    get:
      tags: [Gateway reads]
      summary: List Executors in the operator team
      operationId: listExecutors
      description: Team filtering precedes tag, type, cursor, total, and page shaping.
      parameters:
        - $ref: "#/components/parameters/GatewayOperatorId"
        - $ref: "#/components/parameters/GatewayTeamId"
        - $ref: "#/components/parameters/GatewayTeamName"
        - $ref: "#/components/parameters/GatewayRequestId"
        - $ref: "#/components/parameters/TagFilter"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Team-filtered Executor page, possibly empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutorPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"

  /v1/executors/{executor_id}:
    put:
      tags: [Executor identity]
      summary: Refresh an existing team-bound or system-bound Executor
      operationId: registerExecutor
      description: |
        Restart refresh using the server-generated `executor_id` previously
        persisted in the Executor's cache. The body supplies a `scope` of
        `team` or `system`. When
        `scope = team`, `team_id` is required and must equal the immutable
        team bound to the authenticated Executor identity, and the team
        must already exist. When `scope = system`, the `team_id` property
        must be absent. `authorized_tag` is one required scalar tag; zero-tag and
        multi-tag representations are rejected with `400
        invalid_tag_count`. `max_capacity` and `running_count` are
        observations only and never gate discovery, claim, or
        lifecycle-event acceptance. The Executor body does not carry an
        `identity`; State Registry derives and persists the canonical
        Executor identity exclusively from the authenticated mTLS context.
        Refresh never creates an Executor or creates or updates a team.
      parameters:
        - $ref: "#/components/parameters/ExecutorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutorRegistrationRequest"
      responses:
        "200":
          description: Existing canonical Executor record refreshed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Executor"
        "400":
          description: Invalid registration, including `invalid_tag_count`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/ExecutorNotFound"
    get:
      tags: [Gateway reads]
      summary: Read a canonical Executor
      operationId: getExecutor
      description: A foreign-team Executor identifier returns the same `404 executor_unknown` response as an unknown identifier.
      parameters:
        - $ref: "#/components/parameters/ExecutorId"
        - $ref: "#/components/parameters/GatewayOperatorId"
        - $ref: "#/components/parameters/GatewayTeamId"
        - $ref: "#/components/parameters/GatewayTeamName"
        - $ref: "#/components/parameters/GatewayRequestId"
      responses:
        "200":
          description: Team-owned Executor record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Executor"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/ExecutorNotFound"

  /v1/executors/{executor_id}/tasks:
    get:
      tags: [Executor discovery]
      summary: Discover pending tasks by the exact registered tag in FIFO order
      operationId: discoverExecutorTasks
      description: |
        The authenticated Executor may request only its one registered tag.
        Eligibility precedes ordering; ordering precedes pagination; counts
        apply only after both filters. Selection first applies the
        Executor's scope-conditional eligibility predicate (`tasks.team_id
        = executor.team_id` when `scope = team`; tag-match only when
        `scope = system`), then orders results `(ingested_at ASC, task_id
        ASC)`, where `ingested_at` is immutable per task and `task_id` is
        the deterministic tie-breaker. Discovery is read-only; it never
        reserves or assigns a task and never reads or enforces capacity.
        If only foreign-team tasks match, the result is `204` (or an empty
        `200` page) without count, cursor, or timing disclosure.
      parameters:
        - $ref: "#/components/parameters/ExecutorId"
        - name: tag
          in: query
          required: true
          description: Must exactly equal the authenticated Executor's single registered tag.
          schema:
            $ref: "#/components/schemas/Tag"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One or more eligible `pending` task summaries ordered `(ingested_at ASC, task_id ASC)`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDiscoveryPage"
        "204":
          description: No eligible `pending` task is visible; no pagination metadata is returned.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/ExecutorNotFound"

  /v1/executors/{executor_id}/claim:
    post:
      tags: [Executor discovery]
      summary: Atomically claim the oldest eligible pending task
      operationId: claimTask
      description: |
        The request body carries `task_id` and the immutable `command_id`.
        The Registry claims only when ALL of: the task is `pending`; the
        task's required tag equals the Executor's single registered tag;
        the Executor's scope-conditional eligibility predicate holds
        (`tasks.team_id = executor.team_id` when `scope = team`); AND the
        requested task is the OLDEST currently eligible `pending` task
        for that authenticated Executor. Eligibility precedes FIFO
        ordering. In one transaction, claim sets immutable
        `tasks.owner_command_id` and `tasks.executor_id`, persists
        `tasks.resolved_image` and `tasks.image_source` from the
        four-level precedence, sets `tasks.claimed_at`, appends the FIRST
        lifecycle event `created` with `executor_id = claiming_executor`
        and a payload meaning `task <task_id> loaded by <executor_id>`,
        projects the task to `created`, removes the task from this
        Executor's scope of discovery, and returns `200 claimed`. The
        complete claim-conflict taxonomy is: (a) unknown or foreign
        `task_id` returns non-revealing `404 task_unknown`; (b) eligible
        `task_id` already claimed under a different `command_id` returns
        `409 task_already_claimed`; (c) the same `(task_id, command_id)`
        by the original claiming Executor returns the original `200
        claimed` body with no new event; (d) eligible but non-oldest
        `pending` `task_id` returns `409
        older_task_must_be_claimed_first`; (e) `task_id` whose current
        state is not `pending` (and is not the same `(task_id,
        command_id)` of an existing claim) returns non-revealing `404
        task_unknown`. Capacity observations are not read or evaluated.
        Image strings are not team-owned resources and never authorize.
      parameters:
        - $ref: "#/components/parameters/ExecutorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: Oldest eligible task claimed and the first `created` event committed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotAuthorized"
        "404":
          $ref: "#/components/responses/TaskNotFound"
        "409":
          $ref: "#/components/responses/TaskAlreadyClaimed"

  /v1/executors/{executor_id}/events:
    post:
      tags: [Executor events]
      summary: Append an Executor self event
      operationId: appendExecutorEvent
      description: |
        The complete self-event envelope includes the authenticated
        Executor's `team_id` (null when `scope = system`), non-null
        `executor_id`, nullable `task_id`, stable `event_id`, `event_type`,
        `occurred_at`, and `payload`. Capacity values in a
        `capacity_observed` payload are mirrored to the Executor row in
        the same transaction but never gate work. An identical retry
        returns the original `202` result without duplication.
      parameters:
        - $ref: "#/components/parameters/ExecutorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutorEventAppendRequest"
      responses:
        "202":
          description: Event accepted, or original acceptance returned for an identical retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventAcceptance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            The authenticated Executor's envelope `team_id` does not match
            its immutable service binding (`team_mismatch`); same-team
            executors are the only writers and no event is appended.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/ExecutorNotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Gateway reads]
      summary: Read ordered Executor self-event history
      operationId: listExecutorEvents
      description: Team filtering is applied before event pagination and serialization.
      parameters:
        - $ref: "#/components/parameters/ExecutorId"
        - $ref: "#/components/parameters/GatewayOperatorId"
        - $ref: "#/components/parameters/GatewayTeamId"
        - $ref: "#/components/parameters/GatewayTeamName"
        - $ref: "#/components/parameters/GatewayRequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
